<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - View Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { deepblue: '#1E3A8A', cyan: '#06B6D4', lightbg: '#F8FAFC' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
        }

        .dark-glass {
            background: linear-gradient(145deg, #1E3A8A, #152C6B);
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.05);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .tab-indicator {
            transition: left 0.3s ease, width 0.3s ease;
        }
    </style>



    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-800 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        // Helper to decode file content — handles both plain text and base64
        const decodeFileData = (fileData) => {
            if (!fileData) return 'No file content available.';
            // If it looks like plain text (no data: URI prefix), return as-is
            if (!fileData.startsWith('data:')) return fileData;
            // Otherwise decode base64 data URI
            try { const parts = fileData.split(','); return atob(parts[1] || parts[0]); } catch(e) { return 'Unable to decode file content.'; }
        };

        // ==================== ICONS ====================
        const Icons = {
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>,
            DownloadSm: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            EyeSm: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            // Stat icons
            FileUpLrg: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            ScanLrg: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg>,
            ShieldLrg: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            ClockLrg: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        };

        const fileTypeColors = {
            PDF: 'bg-rose-100 text-rose-600', SQL: 'bg-indigo-100 text-indigo-600', CSV: 'bg-emerald-100 text-emerald-600',
            JSON: 'bg-amber-100 text-amber-600', TXT: 'bg-slate-200 text-slate-600', DOCX: 'bg-blue-100 text-blue-600',
            XLSX: 'bg-green-100 text-green-600', PNG: 'bg-purple-100 text-purple-600', JPG: 'bg-purple-100 text-purple-600',
            MP3: 'bg-pink-100 text-pink-600', WAV: 'bg-pink-100 text-pink-600',
        };

        const ITEMS_PER_PAGE = 6;

        // ==================== MAIN COMPONENT ====================
        const ViewFilesPage = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const activeMenu = 'View Files';
            const [userName, setUserName] = useState('Admin User');

            const [originalFiles, setOriginalFiles] = useState([]);
            const [sanitizedFiles, setSanitizedFiles] = useState([]);

            const [activeTab, setActiveTab] = useState('original');
            const [search, setSearch] = useState('');
            const [filterType, setFilterType] = useState('All');
            const [filterStatus, setFilterStatus] = useState('All');
            const [currentPage, setCurrentPage] = useState(1);
            const [viewFile, setViewFile] = useState(null); // file to view in modal
            const [viewTab, setViewTab] = useState('original'); // 'original' | 'sanitized'
            const lastSnapshotRef = useRef('');
            const debounceRef = useRef(null);

            // Auth guard + real-time files listener
            React.useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(checkAuth);
                    window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (!user) { window.location.href = 'Login.html'; return; }
                        const uDoc = await window.getDoc(window.doc(window.firebaseDb, 'users', user.uid));
                        if (!uDoc.exists() || (uDoc.data().role || '').toLowerCase() !== 'admin') { window.location.href = 'UserDashboard.html'; return; }
                        setUserName(uDoc.data().name || 'Admin User');

                        // Live listener on files (debounced to prevent UI flicker)
                        window.onSnapshot(window.collection(window.firebaseDb, 'files'), (snapshot) => {
                            if (debounceRef.current) clearTimeout(debounceRef.current);
                            debounceRef.current = setTimeout(() => {
                                const all = snapshot.docs.map(d => {
                                    const data = d.data();
                                    const t = data.uploadTime && data.uploadTime.toDate ? data.uploadTime.toDate() : new Date();
                                    const ext = data.fileName.split('.').pop().toUpperCase();
                                    return { id: d.id, ...data, fileType: ext, uploadDate: t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) };
                                });
                                // Fingerprint to reduce jitter
                                const fingerprint = all.map(f => f.id + (f.status||'') + ((f.scanResults||{}).entity_count||0) + ((f.scanResults||{}).threat_level||'') + (f.sanitizedFilePath||'')).join('|');
                                if (fingerprint === lastSnapshotRef.current) return;
                                lastSnapshotRef.current = fingerprint;
                                setOriginalFiles(all.map(f => ({
                                    id: f.id, fileName: f.fileName, uploadedBy: f.uploadedBy || 'Unknown', fileType: f.fileType || f.fileName.split('.').pop().toUpperCase(),
                                    uploadDate: f.uploadDate,
                                    scanStatus: f.status === 'completed' ? 'Scanned' : f.status === 'processing' ? 'Scanned' : f.status === 'error' ? 'Failed' : 'Pending Scan',
                                    piiDetected: f.scanResults ? f.scanResults.entity_count : 0,
                                    threatLevel: f.scanResults ? f.scanResults.threat_level : null,
                                    downloadURL: f.originalFileURL || f.fileUrl || '#',
                                    fileData: f.fileData || null,
                                    sanitizedFileData: f.sanitizedFileData || null,
                                    sanitizedFilePath: f.sanitizedFilePath || null,
                                    scanResults: f.scanResults || null
                                })));
                                setSanitizedFiles(all.filter(f => f.status === 'completed').map(f => ({
                                    id: f.id, fileName: f.fileName.replace(/\./, '_sanitized.'), originalFile: f.fileName,
                                    sanitizedDate: f.uploadDate,
                                    fileType: f.fileType || f.fileName.split('.').pop().toUpperCase(),
                                    piiRemoved: f.scanResults ? f.scanResults.entity_count : 0,
                                    status: 'Completed',
                                    downloadURL: f.sanitizedFileURL || f.originalFileURL || f.fileUrl || '#',
                                    fileData: f.fileData || null,
                                    sanitizedFileData: f.sanitizedFileData || null,
                                    sanitizedFilePath: f.sanitizedFilePath || null,
                                    scanResults: f.scanResults || null
                                })));
                            }, 300);
                        });
                    });
                }, 100);
                return () => clearInterval(checkAuth);
            }, []);

            const handleLogout = async () => {
                try { await window.signOut(window.firebaseAuth); window.location.href = 'Login.html'; } catch (e) { console.error(e); }
            };

            const menuItems = [
                { name: 'Dashboard', icon: Icons.LayoutDashboard, href: 'Dashboard.html' },
                { name: 'Upload Files', icon: Icons.Upload, href: 'Upload.html' },
                { name: 'View Files', icon: Icons.Eye, href: 'ViewFiles.html' },
                { name: 'Manage Users', icon: Icons.Users, href: 'ManageUsers.html' },
                { name: 'Audit Logs', icon: Icons.ClipboardList, href: 'AuditLogs.html' },
                { name: 'Download PII', icon: Icons.Download, href: 'DownloadPII.html' },
                { name: 'Statistical Analysis', icon: Icons.BarChart, href: 'StatisticalAnalysis.html' },
            ];

            // Stats computed dynamically
            const stats = [
                { label: 'Total Files Uploaded', value: originalFiles.length, icon: Icons.FileUpLrg, color: 'blue' },
                { label: 'Files Scanned', value: originalFiles.filter(f => f.scanStatus === 'Scanned').length, icon: Icons.ScanLrg, color: 'cyan' },
                { label: 'Sanitized Files', value: sanitizedFiles.filter(f => f.status === 'Completed').length, icon: Icons.ShieldLrg, color: 'emerald' },
                { label: 'Pending Files', value: originalFiles.filter(f => f.scanStatus === 'Pending Scan').length, icon: Icons.ClockLrg, color: 'amber' },
            ];

            // Filter current tab data
            const currentData = activeTab === 'original' ? originalFiles : sanitizedFiles;
            const allFileTypes = [...new Set(currentData.map(f => f.fileType || '').filter(Boolean))];
            const statusOptions = activeTab === 'original' ? ['Pending Scan', 'Scanned', 'Failed'] : ['Processing', 'Completed', 'Failed'];

            const filtered = useMemo(() => {
                return currentData.filter(f => {
                    const q = search.toLowerCase();
                    const nameField = f.fileName || '';
                    const uploaderField = f.uploadedBy || f.originalFile || '';
                    const matchSearch = !q || nameField.toLowerCase().includes(q) || uploaderField.toLowerCase().includes(q);
                    const matchType = filterType === 'All' || f.fileType === filterType;
                    const statusField = activeTab === 'original' ? f.scanStatus : f.status;
                    const matchStatus = filterStatus === 'All' || statusField === filterStatus;
                    return matchSearch && matchType && matchStatus;
                });
            }, [currentData, search, filterType, filterStatus, activeTab]);

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            const paginated = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            const switchTab = (tab) => { setActiveTab(tab); setCurrentPage(1); setSearch(''); setFilterType('All'); setFilterStatus('All'); };

            // Scan status badge styles
            const scanBadge = { 'Pending Scan': 'bg-amber-100 text-amber-700 border-amber-200', 'Scanned': 'bg-cyan-100 text-cyan-700 border-cyan-200', 'Failed': 'bg-red-100 text-red-600 border-red-200' };
            const sanitizedBadge = { 'Processing': 'bg-amber-100 text-amber-700 border-amber-200', 'Completed': 'bg-emerald-100 text-emerald-700 border-emerald-200', 'Failed': 'bg-red-100 text-red-600 border-red-200' };

            return (
                <div className="flex h-screen w-full bg-slate-50 relative">
                    {sidebarOpen ? <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div> : null}

                    {/* SIDEBAR */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 dark-glass text-white flex flex-col sidebar-transition ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none`}>
                        <div className="h-20 flex items-center px-6 border-b border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <Icons.Shield />
                            <div className="ml-3 flex flex-col"><span className="text-lg font-extrabold tracking-wide leading-tight">PII Sanitization</span><span className="text-xs text-cyan-400 font-medium tracking-wider">SYSTEM</span></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 ml-2">Main Menu</div>
                            {menuItems.map(item => (
                                <button key={item.name} onClick={() => { if (item.name !== activeMenu) window.location.href = item.href; }} className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-300 ${item.name === activeMenu ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)] font-semibold' : 'text-slate-300 hover:bg-white/5 hover:text-white font-medium cursor-pointer'}`}>
                                    <item.icon /><span className="ml-3.5">{item.name}</span>
                                    {item.name === activeMenu ? <div className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,1)]"></div> : null}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/10"><button onClick={handleLogout} className="w-full flex items-center px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><Icons.LogOut /><span className="ml-3.5 font-medium">Logout</span></button></div>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-100/40 rounded-full blur-[100px] pointer-events-none -z-10 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] pointer-events-none -z-10 translate-y-1/3 -translate-x-1/3"></div>

                        {/* NAVBAR */}
                        <header className="h-20 glass-card border-b border-slate-200/60 shadow-sm flex items-center justify-between px-6 lg:px-10 z-10 shrink-0 sticky top-0">
                            <div className="flex items-center">
                                <button className="lg:hidden text-slate-500 hover:text-deepblue mr-4 p-1" onClick={() => setSidebarOpen(true)}><Icons.Menu /></button>
                                <h1 className="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight">View Files</h1>
                            </div>
                            <div className="flex items-center space-x-5 lg:space-x-7">
                                <div className="hidden md:flex relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icons.Search /></div>
                                    <input type="text" className="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 w-48 lg:w-64 transition-all focus:bg-white focus:shadow-md" placeholder="Search files..." />
                                </div>

                                                        <span className="text-xs font-medium text-blue-700">Download the original PDF file below. Text preview is shown underneath.</span>
                                                    </div>
                                                    <a href={viewFile.downloadURL} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                                                        <Icons.DownloadSm />
                                                        Download Original PDF
                                                    </a>
                                                    {viewFile.fileData ? (
                                                        <div className="mt-2">
                                                            <h4 className="text-xs font-bold text-slate-600 mb-2">Text Preview</h4>
                                                            <div className="bg-slate-900 text-blue-300 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[40vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">
                                                                {decodeFileData(viewFile.fileData)}
                                                            </div>
                                                        </div>
                                                    ) : null}
                                                </div>
                                            ) : (
                                                <div className="bg-slate-900 text-blue-300 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[60vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">
                                                    {viewFile.fileData ? decodeFileData(viewFile.fileData) : 'Original file data not available.'}
                                                </div>
                                            )}
                                        </div>
                                    ) : (
                                        <div>
                                            <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                                                <span className="w-1 h-5 bg-emerald-500 rounded-full"></span>
                                                Complete Sanitized File (PII Removed)
                                            </h3>
                                            {viewFile.fileType === 'XLSX' && viewFile.sanitizedFilePath ? (
                                                <div className="space-y-3">
                                                    <div className="bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl flex items-center gap-2">
                                                        <svg className="h-4 w-4 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        <span className="text-xs font-medium text-blue-700">XLSX files cannot be rendered inline. Download the sanitized file to view it in Excel.</span>
                                                    </div>
                                                    <a href={'http://localhost:5000/api/download-sanitized/' + viewFile.id} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                                                        <Icons.DownloadSm />
                                                        Download Sanitized XLSX
                                                    </a>
                                                    {(() => {
                                                        const content = (viewFile.scanResults && viewFile.scanResults.sanitizedFileData) || viewFile.sanitizedFileData || (viewFile.scanResults && viewFile.scanResults.masked_text) || '';
                                                        if (!content) return null;
                                                        return (
                                                            <div>
                                                                <h4 className="text-xs font-bold text-slate-600 mb-2 mt-3">Text Preview</h4>
                                                                <div className="bg-slate-900 text-green-400 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[40vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">{content}</div>
                                                            </div>
                                                        );
                                                    })()}
                                                </div>
                                            ) : ['PNG','JPG','JPEG'].includes(viewFile.fileType) ? (
                                                <div className="space-y-3">
                                                    <div className="bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl flex items-center gap-2">
                                                        <svg className="h-4 w-4 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        <span className="text-xs font-medium text-blue-700">Sanitized image with PII visually redacted (black boxes).</span>
                                                    </div>
                                                    <div className="bg-slate-100 rounded-xl p-4 border border-slate-200 flex justify-center">
                                                        <img src={'http://localhost:5000/api/download-sanitized/' + viewFile.id + '?inline=1'} alt="Sanitized" className="max-h-[40vh] rounded-lg shadow" onError={(e) => { e.target.style.display='none'; }} />
                                                    </div>
                                                    <a href={'http://localhost:5000/api/download-sanitized/' + viewFile.id} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-5 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                                                        <Icons.DownloadSm />
                                                        Download Sanitized Image
                                                    </a>
                                                    {(() => {
                                                        const content = (viewFile.scanResults && viewFile.scanResults.sanitizedFileData) || viewFile.sanitizedFileData || (viewFile.scanResults && viewFile.scanResults.masked_text) || '';
                                                        if (!content) return null;
                                                        return (
                                                            <div>
                                                                <h4 className="text-xs font-bold text-slate-600 mb-2 mt-1">OCR Text (Sanitized)</h4>
                                                                <div className="bg-slate-900 text-green-400 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[30vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">{content}</div>
                                                            </div>
                                                        );
                                                    })()}
                                                </div>
                                            ) : viewFile.fileType === 'PDF' && viewFile.sanitizedFilePath ? (
                                                <div className="space-y-3">
                                                    <div className="bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl flex items-center gap-2">
                                                        <svg className="h-4 w-4 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        <span className="text-xs font-medium text-blue-700">Text preview shown below. Download the file for the full redacted PDF document.</span>
                                                    </div>

                                                    {(() => {
                                                        const content = (viewFile.scanResults && viewFile.scanResults.sanitizedFileData) || viewFile.sanitizedFileData || (viewFile.scanResults && viewFile.scanResults.masked_text) || '';
                                                        if (!content) return null;
                                                        return (
                                                            <div>
                                                                <h4 className="text-xs font-bold text-slate-600 mb-2 mt-1">Text Preview</h4>
                                                                <div className="bg-slate-900 text-green-400 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[40vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">{content}</div>
                                                            </div>
                                                        );
                                                    })()}
                                                </div>
                                            ) : (
                                                <React.Fragment>
                                                {viewFile.fileType === 'DOCX' && viewFile.sanitizedFilePath ? (
                                                    <div className="bg-blue-50 border border-blue-200 px-4 py-2 rounded-xl flex items-center gap-2 mb-3">
                                                        <svg className="h-4 w-4 text-blue-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        <span className="text-xs font-medium text-blue-700">{"Text preview shown below. Download the file for the full formatted " + viewFile.fileType + " document."}</span>
                                                    </div>
                                                ) : null}
                                                <div className="bg-slate-900 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[60vh] overflow-y-auto border border-slate-700">
                                                    <pre className="text-green-400 whitespace-pre-wrap m-0">{(() => {
                                                        const content = (viewFile.scanResults && viewFile.scanResults.sanitizedFileData) || viewFile.sanitizedFileData || (viewFile.scanResults && viewFile.scanResults.masked_text) || '';
                                                        if (!content) return 'Sanitized content not available. File may not have been scanned yet.';
                                                        return content;
                                                    })()}</pre>
                                                </div>
                                                </React.Fragment>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Modal Footer */}
                                <div className="border-t border-slate-200 p-4 flex justify-between items-center shrink-0 bg-slate-50">
                                    {viewTab === 'sanitized' && !['PNG','JPG','JPEG','XLSX'].includes(viewFile.fileType) && viewFile.sanitizedFilePath ? (
                                        <a href={'http://localhost:5000/api/download-sanitized/' + viewFile.id} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                                            <Icons.DownloadSm />
                                            Download Sanitized File
                                        </a>
                                    ) : viewTab === 'original' && !['PNG','JPG','JPEG'].includes(viewFile.fileType) && viewFile.downloadURL && viewFile.downloadURL !== '#' ? (
                                        <a href={viewFile.downloadURL} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all text-sm">
                                            <Icons.DownloadSm />
                                            Download Original File
                                        </a>
                                    ) : <div></div>}
                                    <button onClick={() => setViewFile(null)} className="px-6 py-2.5 bg-gradient-to-r from-deepblue to-cyan-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all text-sm">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ViewFilesPage />);
    </script>
</body>

</html>
