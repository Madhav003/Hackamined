<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepblue: '#1E3A8A',
                        cyan: '#06B6D4',
                        lightbg: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'ping-slow': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.05);
        }

        .dark-glass {
            background: linear-gradient(145deg, #1E3A8A, #152C6B);
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        /* Sidebar transition for mobile */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }
    </style>
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-800 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icon SVG Components
        const Icons = {
            // Sidebar
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Scan: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4" /></svg>,
            FileCheck: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,

            // Navbar
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,

            // General UI
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            ArrowRight: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>,
            DownloadCloud: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" /></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            FileUp: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            AlertTriangle: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            ShieldCheck: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,

            // Format Icons
            Database: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>,
            FilePDF: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 13a2 2 0 114 0v1h-4v-1z" /></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            FileImage: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
        };

        const Dashboard = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeMenu, setActiveMenu] = useState('Dashboard');
            const [userName, setUserName] = useState('Admin User');
            const [loading, setLoading] = useState(true);
            const [stats, setStats] = useState([
                { label: 'Total Files Uploaded', value: '0', change: 'Loading...', icon: Icons.FileUp, color: 'blue' },
                { label: 'Files Processed', value: '0', change: 'Loading...', icon: Icons.CheckCircle, color: 'cyan' },
                { label: 'PII Entities Detected', value: '—', change: 'Across all datasets', icon: Icons.AlertTriangle, color: 'amber' },
                { label: 'Sanitized Files', value: '0', change: 'Ready for download', icon: Icons.ShieldCheck, color: 'emerald' },
            ]);
            const [activities, setActivities] = useState([]);

            // Auth guard + load data
            useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(checkAuth);
                    window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (!user) { window.location.href = 'Login.html'; return; }
                        // Check role
                        const userDoc = await window.getDoc(window.doc(window.firebaseDb, 'users', user.uid));
                        if (!userDoc.exists() || (userDoc.data().role || '').toLowerCase() !== 'admin') { window.location.href = 'UserDashboard.html'; return; }
                        setUserName(userDoc.data().name || 'Admin User');

                        // Fetch files for stats
                        try {
                            const filesSnap = await window.getDocs(window.collection(window.firebaseDb, 'files'));
                            const files = filesSnap.docs.map(d => d.data());
                            const total = files.length;
                            const completed = files.filter(f => f.status === 'completed').length;
                            const processing = files.filter(f => f.status === 'processing' || f.status === 'uploaded').length;
                            // Aggregate PII entities from scan results
                            let totalPII = 0;
                            files.forEach(f => {
                                if (f.scanResults && f.scanResults.entity_count) {
                                    totalPII += f.scanResults.entity_count;
                                }
                            });

                            setStats([
                                { label: 'Total Files Uploaded', value: String(total), change: `${processing} processing`, icon: Icons.FileUp, color: 'blue' },
                                { label: 'Files Processed', value: String(completed + processing), change: total > 0 ? `${Math.round(((completed + processing) / total) * 100)}% success rate` : '0%', icon: Icons.CheckCircle, color: 'cyan' },
                                { label: 'PII Entities Detected', value: totalPII > 0 ? totalPII.toLocaleString() : '0', change: 'Across all datasets', icon: Icons.AlertTriangle, color: 'amber' },
                                { label: 'Sanitized Files', value: String(completed), change: 'Ready for download', icon: Icons.ShieldCheck, color: 'emerald' },
                            ]);

                            // Recent activities from files
                            const recentFiles = [...files]
                                .filter(f => f.uploadTime)
                                .sort((a, b) => {
                                    const ta = a.uploadTime.toDate ? a.uploadTime.toDate() : new Date(a.uploadTime);
                                    const tb = b.uploadTime.toDate ? b.uploadTime.toDate() : new Date(b.uploadTime);
                                    return tb - ta;
                                })
                                .slice(0, 5);
                            setActivities(recentFiles.map((f, i) => {
                                const t = f.uploadTime.toDate ? f.uploadTime.toDate() : new Date(f.uploadTime);
                                const diff = Date.now() - t.getTime();
                                const mins = Math.floor(diff / 60000);
                                let timeStr = mins < 60 ? `${mins} mins ago` : `${Math.floor(mins / 60)} hours ago`;
                                if (mins < 1) timeStr = 'Just now';
                                const statusColor = f.status === 'completed' ? 'emerald' : f.status === 'processing' ? 'amber' : 'blue';
                                const statusLabel = f.status === 'completed' ? 'Completed' : f.status === 'processing' ? 'Processing' : 'Uploaded';
                                return { id: i, action: `File uploaded by ${f.uploadedBy || 'Unknown'}`, document: f.fileName, status: statusLabel, time: timeStr, color: statusColor };
                            }));
                        } catch (e) { console.error('Stats fetch error:', e); }
                        setLoading(false);
                    });
                }, 100);
                return () => clearInterval(checkAuth);
            }, []);

            const menuItems = [
                { name: 'Dashboard', icon: Icons.LayoutDashboard, href: 'Dashboard.html' },
                { name: 'Upload Files', icon: Icons.Upload, href: 'Upload.html' },
                { name: 'View Files', icon: Icons.Eye, href: 'ViewFiles.html' },
                { name: 'Manage Users', icon: Icons.Users, href: 'ManageUsers.html' },
                { name: 'Audit Logs', icon: Icons.ClipboardList, href: 'AuditLogs.html' },
                { name: 'Download PII', icon: Icons.Download, href: 'DownloadPII.html' },
                { name: 'Statistical Analysis', icon: Icons.BarChart, href: 'StatisticalAnalysis.html' },
            ];

            const handleLogout = async () => {
                try {
                    await window.signOut(window.firebaseAuth);
                    window.location.href = 'Login.html';
                } catch (e) { console.error('Logout error:', e); }
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 relative">

                    {/* Mobile Sidebar Overlay */}
                    {sidebarOpen && (
                        <div
                            className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden backdrop-blur-sm transition-opacity"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 dark-glass text-white flex flex-col sidebar-transition ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none`}>
                        {/* Logo Area */}
                        <div className="h-20 flex items-center px-6 border-b border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <Icons.Shield />
                            <div className="ml-3 flex flex-col">
                                <span className="text-lg font-extrabold tracking-wide leading-tight">PII Sanitization</span>
                                <span className="text-xs text-cyan-400 font-medium tracking-wider">SYSTEM</span>
                            </div>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5 custom-scrollbar">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 ml-2">Main Menu</div>
                            {menuItems.map((item) => {
                                const Icon = item.icon;
                                const isActive = activeMenu === item.name;
                                return (
                                    <button
                                        key={item.name}
                                        onClick={() => { if (item.name !== activeMenu) window.location.href = item.href; }}
                                        className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-300 group ${isActive
                                            ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)]'
                                            : 'text-slate-300 hover:bg-white/5 hover:text-white cursor-pointer'
                                            }`}
                                    >
                                        <Icon />
                                        <span className={`ml-3.5 font-medium ${isActive ? 'font-semibold' : ''}`}>{item.name}</span>
                                        {isActive && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,1)]"></div>}
                                    </button>
                                );
                            })}
                        </nav>

                        {/* User / Logout */}
                        <div className="p-4 border-t border-white/10">
                            <button onClick={handleLogout} className="w-full flex items-center px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 hover:text-white transition-all group">
                                <Icons.LogOut />
                                <span className="ml-3.5 font-medium">Logout</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Background subtle elements */}
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-100/40 rounded-full blur-[100px] pointer-events-none -z-10 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] pointer-events-none -z-10 translate-y-1/3 -translate-x-1/3"></div>

                        {/* Top Navbar */}
                        <header className="h-20 glass-card border-b border-slate-200/60 shadow-sm flex items-center justify-between px-6 lg:px-10 z-10 shrink-0 sticky top-0">
                            <div className="flex items-center">
                                <button
                                    className="lg:hidden text-slate-500 hover:text-deepblue mr-4 transition-colors p-1"
                                    onClick={() => setSidebarOpen(true)}
                                >
                                    <Icons.Menu />
                                </button>
                                <h1 className="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight">{activeMenu}</h1>
                            </div>

                            <div className="flex items-center space-x-5 lg:space-x-7">
                                {/* Search Bar (Hidden on small mobile) */}
                                <div className="hidden md:flex relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Icons.Search />
                                    </div>
                                    <input
                                        type="text"
                                        className="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 w-48 lg:w-64 transition-all duration-300 focus:bg-white focus:shadow-md"
                                        placeholder="Search logs or files..."
                                    />
                                </div>

                                {/* Notifications */}
                                <button className="relative text-slate-500 hover:text-deepblue transition-colors p-1">
                                    <Icons.Bell />
                                    <span className="absolute top-0 right-0 h-2.5 w-2.5 bg-red-500 border-2 border-white rounded-full animate-pulse-slow"></span>
                                </button>

                                {/* Profile Dropdown */}
                                <div className="flex items-center space-x-3 cursor-pointer group pl-2 border-l border-slate-200">
                                    <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-deepblue to-cyan-500 p-[2px]">
                                        <div className="w-full h-full rounded-full border-2 border-white bg-white overflow-hidden flex items-center justify-center">
                                            <svg className="w-5 h-5 text-slate-300 mt-1" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd"></path></svg>
                                        </div>
                                    </div>
                                    <div className="hidden lg:block text-left">
                                        <div className="text-sm font-semibold text-slate-700 leading-tight">{userName}</div>
                                        <div className="text-[11px] text-slate-500 font-medium">Platform Admin</div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Scrollable Content Body */}
                        <div className="flex-1 overflow-y-auto p-6 lg:p-10 pb-24 relative z-0">
                            <div className="max-w-7xl mx-auto space-y-8">

                                {/* Welcome Section */}
                                <div className="glass-card rounded-2xl overflow-hidden relative shadow-lg border border-white/60">
                                    {/* Abstract corner graphics */}
                                    <div className="absolute top-0 right-0 bg-slate-900 w-full md:w-1/2 h-full opacity-5 skew-x-12 origin-top-right transform translate-x-10 pointer-events-none"></div>
                                    <div className="absolute inset-0 bg-gradient-to-r from-deepblue/5 to-transparent pointer-events-none"></div>

                                    <div className="flex flex-col md:flex-row items-center p-8 lg:p-12 relative z-10">
                                        <div className="flex-1 mb-8 md:mb-0 md:pr-10">
                                            <h2 className="text-3xl lg:text-4xl font-extrabold text-slate-800 mb-6 tracking-tight">
                                                Welcome to the <span className="text-white tracking-widest pl-1" style={{ WebkitTextStroke: '5px #1E3A8A', paintOrder: 'stroke fill' }}>PII Sanitization</span> System
                                            </h2>
                                            <p className="text-slate-600 text-lg leading-relaxed max-w-2xl font-medium">
                                                This platform helps detect and remove sensitive personal information from files using AI-powered scanning and secure data processing. Ensure compliance and protect data privacy in seconds.
                                            </p>
                                        </div>

                                        {/* Document scanning illustration right side */}
                                        <div className="w-full md:w-auto flex-shrink-0 animate-float">
                                            <div className="relative bg-white p-6 rounded-2xl shadow-xl border border-slate-100 max-w-sm">
                                                <div className="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-2xl blur opacity-20"></div>
                                                <div className="flex items-center space-x-3 mb-4 relative z-10">
                                                    <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
                                                        <Icons.Shield />
                                                    </div>
                                                    <div>
                                                        <div className="text-sm font-bold text-slate-800">Secure Scan Active</div>
                                                        <div className="text-xs text-green-500 font-medium">System operational</div>
                                                    </div>
                                                </div>
                                                <div className="space-y-3 relative z-10">
                                                    <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                                                        <div className="h-full bg-cyan-400 w-3/4 rounded-full"></div>
                                                    </div>
                                                    <div className="h-2 w-5/6 bg-slate-100 rounded-full overflow-hidden">
                                                        <div className="h-full bg-deepblue w-1/2 rounded-full"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Statistics Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {stats.map((stat, idx) => {
                                        const Icon = stat.icon;
                                        return (
                                            <div key={idx} className="glass-card bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 border border-slate-100 group relative overflow-hidden">
                                                {/* Hover gradient effect */}
                                                <div className="absolute inset-0 bg-gradient-to-br from-transparent to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>

                                                <div className="flex justify-between items-start relative z-10">
                                                    <div>
                                                        <p className="text-sm font-semibold text-slate-500 mb-1">{stat.label}</p>
                                                        <h3 className="text-3xl font-extrabold text-slate-800 mb-2">{stat.value}</h3>
                                                        <span className="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">{stat.change}</span>
                                                    </div>
                                                    <div className={`p-3 rounded-xl bg-${stat.color}-50 text-${stat.color}-500 transform group-hover:scale-110 transition-transform duration-300`}>
                                                        <Icon />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Main Lower Section */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">

                                    {/* Left Column: Workflow & File Types */}
                                    <div className="lg:col-span-2 space-y-8">

                                        {/* Workflow Section */}
                                        <div className="glass-card bg-white p-8 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden">
                                            <h3 className="text-lg font-bold text-slate-800 mb-8 flex items-center">
                                                <span className="w-1.5 h-6 bg-cyan-500 rounded-full mr-3"></span>
                                                System Workflow
                                            </h3>

                                            <div className="flex justify-between items-center relative py-4">
                                                {/* Connecting Line */}
                                                <div className="absolute top-1/2 left-0 w-full h-0.5 bg-slate-100 -translate-y-1/2 z-0 hidden md:block"></div>

                                                {[
                                                    { title: "Upload File", icon: <Icons.Upload />, color: "blue", desc: "Submit dataset" },
                                                    { title: "PII Detection", icon: <Icons.Scan />, color: "amber", desc: "AI scanning" },
                                                    { title: "Sanitization", icon: <Icons.Shield />, color: "cyan", desc: "Redact & replace" },
                                                    { title: "Download", icon: <Icons.DownloadCloud />, color: "emerald", desc: "PII-Free file" }
                                                ].map((step, idx) => (
                                                    <div key={idx} className="relative z-10 flex flex-col items-center group">
                                                        <div className={`w-16 h-16 rounded-full bg-white shadow-md border border-slate-100 flex items-center justify-center text-${step.color}-500 mb-4 group-hover:-translate-y-2 transition-transform duration-300 relative`}>
                                                            <div className={`absolute inset-0 rounded-full bg-${step.color}-400 opacity-0 group-hover:opacity-20 blur-md transition-opacity duration-300`}></div>
                                                            {React.cloneElement(step.icon, { className: 'w-7 h-7' })}
                                                        </div>
                                                        <span className="font-bold text-slate-700 text-sm whitespace-nowrap">{step.title}</span>
                                                        <span className="text-xs text-slate-500 font-medium hidden md:block mt-1">{step.desc}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Supported Formats */}
                                        <div className="glass-card bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                                            <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center">
                                                <span className="w-1.5 h-6 bg-deepblue rounded-full mr-3"></span>
                                                Supported File Formats
                                            </h3>
                                            <div className="flex flex-wrap gap-4">
                                                {[
                                                    { name: 'SQL', icon: <Icons.Database /> },
                                                    { name: 'PDF', icon: <Icons.FilePDF /> },
                                                    { name: 'DOCX', icon: <Icons.FileText /> },
                                                    { name: 'CSV', icon: <Icons.Database /> },
                                                    { name: 'JSON', icon: <Icons.Database /> },
                                                    { name: 'TXT', icon: <Icons.FileText /> },
                                                    { name: 'Images', icon: <Icons.FileImage /> }
                                                ].map((format, idx) => (
                                                    <div key={idx} className="flex items-center space-x-3 px-4 py-3 bg-slate-50 rounded-xl border border-slate-100 hover:border-cyan-300 hover:shadow-md transition-all cursor-pointer group">
                                                        <div className="bg-white p-1.5 rounded-lg shadow-sm group-hover:scale-110 transition-transform">
                                                            {React.cloneElement(format.icon, { className: 'w-6 h-6' })}
                                                        </div>
                                                        <span className="font-bold text-slate-700">{format.name}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Column: Recent Activity */}
                                    <div className="glass-card bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col overflow-hidden">
                                        <div className="p-6 lg:p-8 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                            <h3 className="text-lg font-bold text-slate-800 flex items-center">
                                                <span className="w-1.5 h-6 bg-emerald-500 rounded-full mr-3"></span>
                                                Recent Activity
                                            </h3>
                                            <button className="text-xs font-semibold text-deepblue hover:text-cyan-600 transition-colors">View All</button>
                                        </div>
                                        <div className="p-6 lg:p-8 flex-1 overflow-y-auto custom-scrollbar">
                                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-2.5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">

                                                {activities.map((act, idx) => {
                                                    const statusColors = {
                                                        'Processing': 'bg-blue-100 text-blue-700 border-blue-200',
                                                        'Warning': 'bg-amber-100 text-amber-700 border-amber-200',
                                                        'Success': 'bg-emerald-100 text-emerald-700 border-emerald-200',
                                                        'Info': 'bg-slate-100 text-slate-600 border-slate-200'
                                                    };

                                                    const dotColors = {
                                                        'blue': 'bg-blue-500 ring-blue-100',
                                                        'amber': 'bg-amber-500 ring-amber-100',
                                                        'emerald': 'bg-emerald-500 ring-emerald-100',
                                                        'slate': 'bg-slate-400 ring-slate-100'
                                                    };

                                                    return (
                                                        <div key={idx} className="relative flex items-start space-x-4">
                                                            <div className="relative mt-1">
                                                                <div className={`w-5 h-5 rounded-full ring-4 z-10 relative flex items-center justify-center ${dotColors[act.color]}`}>
                                                                    <div className="w-2 h-2 rounded-full bg-white"></div>
                                                                </div>
                                                            </div>
                                                            <div className="flex-1 bg-white p-4 rounded-xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow group">
                                                                <div className="flex justify-between items-start mb-1">
                                                                    <h4 className="text-sm font-bold text-slate-800 group-hover:text-deepblue transition-colors">{act.action}</h4>
                                                                    <span className="text-[10px] text-slate-400 font-medium whitespace-nowrap ml-2">{act.time}</span>
                                                                </div>
                                                                <p className="text-xs text-slate-500 font-mono bg-slate-50 py-1 px-2 rounded mt-2 inline-block truncate max-w-[200px]">{act.document}</p>
                                                                <div className="mt-3">
                                                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${statusColors[act.status]}`}>
                                                                        {act.status}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    )
                                                })}

                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>

</html>
