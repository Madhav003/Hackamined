<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - User Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepblue: '#1E3A8A',
                        cyan: '#06B6D4',
                        lightbg: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'ping-slow': 'ping 3s cubic-bezier(0, 0, 0.2, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.05);
        }

        .dark-glass {
            background: linear-gradient(145deg, #1E3A8A, #152C6B);
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        /* Sidebar transition for mobile */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }
    </style>
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-800 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Icon SVG Components
        const Icons = {
            // Sidebar
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            FileCheck: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            History: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,

            // Navbar
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-slate-500 hover:text-deepblue" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,

            // General UI
            ShieldCheck: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-cyan-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            DocumentCheck: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>,
            RefreshCw: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
            DownloadSmall: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>,
        };

        const UserDashboard = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeMenu, setActiveMenu] = useState('Dashboard');
            const [userName, setUserName] = useState('User');
            const [userInitials, setUserInitials] = useState('U');
            const [stats, setStats] = useState([
                { label: 'Sanitized Files Available', value: '0', icon: Icons.DocumentCheck, color: 'blue' },
                { label: 'Total Files', value: '0', icon: Icons.Download, color: 'indigo' },
                { label: 'Processing', value: '0', icon: Icons.RefreshCw, color: 'cyan' },
                { label: 'Security Status', value: 'Protected', icon: Icons.ShieldCheck, color: 'emerald' },
            ]);
            const [files, setFiles] = useState([]);
            const [activities, setActivities] = useState([]);
            const [viewFile, setViewFile] = useState(null); // file to view sanitized content

            const menuItems = [
                { name: 'Dashboard', icon: Icons.LayoutDashboard, href: 'UserDashboard.html' },
                { name: 'View', icon: Icons.Eye, href: 'SanitizedFilesViewer.html' },
                { name: 'Download', icon: Icons.Download, href: 'DownloadSanitized.html' },
                { name: 'Search', icon: Icons.Search, href: 'SearchSanitized.html' },
                { name: 'Statistical Analysis', icon: Icons.BarChart, href: 'UserStatisticalAnalysis.html' },
            ];

            // Auth guard + fetch data
            useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(checkAuth);
                    window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (!user) { window.location.href = 'Login.html'; return; }
                        const userDoc = await window.getDoc(window.doc(window.firebaseDb, 'users', user.uid));
                        if (!userDoc.exists()) { window.location.href = 'Login.html'; return; }
                        if ((userDoc.data().role || '').toLowerCase() === 'admin') { window.location.href = 'Dashboard.html'; return; }
                        const name = userDoc.data().name || 'User';
                        setUserName(name);
                        setUserInitials(name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2));

                        // Fetch files
                        try {
                            const filesSnap = await window.getDocs(window.collection(window.firebaseDb, 'files'));
                            const allFiles = filesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                            const completed = allFiles.filter(f => f.status === 'completed');
                            const processing = allFiles.filter(f => f.status === 'uploaded' || f.status === 'processing').length;

                            setStats([
                                { label: 'Sanitized Files Available', value: String(completed.length), icon: Icons.DocumentCheck, color: 'blue' },
                                { label: 'Total Files', value: String(allFiles.length), icon: Icons.Download, color: 'indigo' },
                                { label: 'Processing', value: String(processing), icon: Icons.RefreshCw, color: 'cyan' },
                                { label: 'Security Status', value: 'Protected', icon: Icons.ShieldCheck, color: 'emerald' },
                            ]);

                            setFiles(completed.map(f => {
                                const t = f.uploadTime && f.uploadTime.toDate ? f.uploadTime.toDate() : new Date();
                                return {
                                    id: f.id,
                                    name: f.fileName,
                                    type: f.fileType || f.fileName.split('.').pop().toUpperCase(),
                                    date: t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                                    status: 'Sanitized',
                                    downloadURL: f.sanitizedFileURL || f.originalFileURL || '#',
                                    maskedText: f.scanResults ? f.scanResults.masked_text : null,
                                    entityCount: f.scanResults ? f.scanResults.entity_count : 0,
                                };
                            }));
                        } catch (e) { console.error('Fetch error:', e); }
                    });
                }, 100);
                return () => clearInterval(checkAuth);
            }, []);

            const handleLogout = async () => {
                try { await window.signOut(window.firebaseAuth); window.location.href = 'Login.html'; } catch (e) { console.error(e); }
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 relative">

                    {/* Mobile Sidebar Overlay */}
                    {sidebarOpen && (
                        <div
                            className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden backdrop-blur-sm transition-opacity"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 dark-glass text-white flex flex-col sidebar-transition ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none`}>
                        {/* Logo Area */}
                        <div className="h-20 flex items-center px-6 border-b border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <div className="p-1.5 bg-cyan-500/20 rounded-lg">
                                <Icons.Lock />
                            </div>
                            <div className="ml-3 flex flex-col">
                                <span className="text-lg font-extrabold tracking-wide leading-tight">PII Sanitization</span>
                                <span className="text-[10px] text-cyan-400 font-bold uppercase tracking-widest mt-0.5">User Portal</span>
                            </div>
                        </div>

                        {/* Navigation Menu */}
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5 custom-scrollbar">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 ml-2">Main Menu</div>
                            {menuItems.map((item) => {
                                const Icon = item.icon;
                                const isActive = activeMenu === item.name;
                                return (
                                    <button
                                        key={item.name}
                                        onClick={() => { if (item.name !== activeMenu) window.location.href = item.href; }}
                                        className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-300 group ${isActive
                                            ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)]'
                                            : 'text-slate-300 hover:bg-white/5 hover:text-white cursor-pointer'
                                            }`}
                                    >
                                        <Icon />
                                        <span className={`ml-3.5 font-medium ${isActive ? 'font-semibold' : ''}`}>{item.name}</span>
                                        {isActive && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,1)]"></div>}
                                    </button>
                                );
                            })}
                        </nav>

                        {/* Settings / Logout */}
                        <div className="p-4 border-t border-white/10 pb-6">
                            <button onClick={handleLogout} className="w-full flex items-center px-4 py-3 rounded-xl text-slate-300 hover:bg-red-500/10 hover:text-red-400 transition-all group">
                                <Icons.LogOut />
                                <span className="ml-3.5 font-medium">Logout</span>
                            </button>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Background subtle elements */}
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-100/40 rounded-full blur-[100px] pointer-events-none -z-10 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] pointer-events-none -z-10 translate-y-1/3 -translate-x-1/3"></div>

                        {/* Top Navbar */}
                        <header className="h-20 glass-card border-b border-slate-200/60 shadow-sm flex items-center justify-between px-6 lg:px-10 z-10 shrink-0 sticky top-0">
                            <div className="flex items-center">
                                <button
                                    className="lg:hidden text-slate-500 hover:text-deepblue mr-4 transition-colors p-1"
                                    onClick={() => setSidebarOpen(true)}
                                >
                                    <Icons.Menu />
                                </button>
                                <h1 className="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight">User Dashboard</h1>
                            </div>

                            <div className="flex items-center space-x-5 lg:space-x-7">
                                {/* Search Bar */}
                                <div className="hidden md:flex relative group">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <Icons.Search />
                                    </div>
                                    <input
                                        type="text"
                                        className="pl-10 pr-4 py-2 bg-slate-100 border-none rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50 w-48 lg:w-72 transition-all duration-300 focus:bg-white focus:shadow-md"
                                        placeholder="Search sanitized records..."
                                    />
                                    <div className="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                        <kbd className="hidden lg:inline-block text-[10px] font-semibold text-slate-400 bg-slate-200 px-1.5 py-0.5 rounded">⌘ K</kbd>
                                    </div>
                                </div>

                                {/* Notifications */}
                                <button className="relative p-1">
                                    <Icons.Bell />
                                    <span className="absolute top-0 right-0 h-2.5 w-2.5 bg-cyan-500 border-2 border-white rounded-full"></span>
                                </button>

                                {/* Profile Dropdown */}
                                <div className="flex items-center space-x-3 cursor-pointer group pl-3 border-l border-slate-200">
                                    <div className="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold border-2 border-white shadow-sm">
                                        {userInitials}
                                    </div>
                                    <div className="hidden lg:block text-left">
                                        <div className="text-sm font-semibold text-slate-700 leading-tight">{userName}</div>
                                        <div className="text-[11px] text-slate-500 font-medium">Standard User</div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Scrollable Content Body */}
                        <div className="flex-1 overflow-y-auto p-6 lg:p-10 pb-24 relative z-0">
                            <div className="max-w-7xl mx-auto space-y-8">

                                {/* Welcome Section */}
                                <div className="glass-card rounded-2xl overflow-hidden relative shadow-md border border-white/60 bg-gradient-to-r from-deepblue to-[#11255C]">
                                    {/* Abstract corner graphics */}
                                    <div className="absolute inset-0 opacity-10 pointer-events-none overflow-hidden" style={{ backgroundImage: 'radial-gradient(circle at 2px 2px, white 1px, transparent 0)', backgroundSize: '30px 30px' }}></div>
                                    <div className="absolute top-0 right-0 w-[400px] h-full bg-cyan-500/10 skew-x-12 transform translate-x-20 pointer-events-none blur-3xl"></div>

                                    <div className="flex flex-col md:flex-row items-center p-8 lg:p-10 relative z-10 text-white">
                                        <div className="flex-1 mb-6 md:mb-0 md:pr-10">
                                            <h2 className="text-2xl lg:text-3xl font-extrabold mb-4 tracking-tight flex items-center gap-3">
                                                Welcome to the PII Sanitization Platform
                                            </h2>
                                            <p className="text-cyan-50/80 text-base leading-relaxed max-w-2xl font-medium">
                                                You can safely view and download sanitized files where sensitive personal information has been automatically removed. All data accessed here is fully compliant with privacy standards.
                                            </p>
                                        </div>

                                        {/* Document scanning illustration right side */}
                                        <div className="w-full md:w-auto flex-shrink-0 animate-float">
                                            <div className="relative bg-white/10 backdrop-blur-md p-5 rounded-2xl border border-white/20 max-w-[200px] flex items-center justify-center">
                                                <div className="absolute -top-3 -right-3 bg-emerald-500 w-8 h-8 rounded-full border-4 border-[#11255C] flex items-center justify-center text-white shadow-lg">
                                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                                                </div>
                                                <Icons.Lock />
                                                <div className="ml-3 text-sm font-bold text-white uppercase tracking-wider">Secured<br />Data</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Statistics Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {stats.map((stat, idx) => {
                                        const Icon = stat.icon;
                                        return (
                                            <div key={idx} className="glass-card bg-white p-6 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 border border-slate-200 group relative">
                                                <div className="flex justify-between items-start relative z-10">
                                                    <div>
                                                        <h3 className="text-3xl font-extrabold text-slate-800 mb-2">{stat.value}</h3>
                                                        <p className="text-sm font-semibold text-slate-500 leading-snug tracking-tight">{stat.label}</p>
                                                    </div>
                                                    <div className={`p-3 rounded-xl bg-${stat.color}-50 text-${stat.color}-500 transform group-hover:-translate-y-1 transition-transform duration-300`}>
                                                        <Icon />
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Security Notice */}
                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-start sm:items-center space-x-4 shadow-sm">
                                    <div className="bg-amber-100 p-2 rounded-lg text-amber-600 shrink-0 mt-1 sm:mt-0">
                                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                    </div>
                                    <p className="text-sm font-medium text-amber-800">
                                        <span className="font-bold">Security Notice:</span> Only sanitized files are accessible in this portal. Any sensitive personal information (PII) within these documents has been automatically masked or removed by the system.
                                    </p>
                                </div>

                                {/* Layout grid for Table and Activity */}
                                <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">

                                    {/* Left Area: Search & Files Table */}
                                    <div className="xl:col-span-2 space-y-6">
                                        {/* Table Header / Filters */}
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                            <h3 className="text-xl font-bold text-slate-800 flex items-center">
                                                Available Files
                                            </h3>
                                            <div className="flex bg-white rounded-lg p-1 border border-slate-200 shadow-sm self-stretch sm:self-auto">
                                                <button className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium bg-slate-100 text-slate-800 rounded shadow-sm">
                                                    All Formats
                                                </button>
                                                <button className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
                                                    PDF
                                                </button>
                                                <button className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
                                                    CSV
                                                </button>
                                                <button className="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">
                                                    <Icons.Filter />
                                                </button>
                                            </div>
                                        </div>

                                        {/* Table Card */}
                                        <div className="glass-card bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-50/50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500 font-semibold">
                                                            <th className="p-4 pl-6">File Name</th>
                                                            <th className="p-4">Type</th>
                                                            <th className="p-4">Date Processed</th>
                                                            <th className="p-4">Status</th>
                                                            <th className="p-4 pr-6 text-right">Action</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-100 text-sm">
                                                        {files.map((file) => (
                                                            <tr key={file.id} className="hover:bg-slate-50/80 transition-colors group">
                                                                <td className="p-4 pl-6 font-medium text-slate-800 flex items-center gap-3">
                                                                    <div className="w-8 h-8 rounded bg-slate-100 flex items-center justify-center text-slate-500 font-bold text-[10px]">
                                                                        {file.type}
                                                                    </div>
                                                                    <span className="truncate max-w-[200px] sm:max-w-xs">{file.name}</span>
                                                                </td>
                                                                <td className="p-4 font-mono text-xs text-slate-500">{file.type}</td>
                                                                <td className="p-4 text-slate-500 whitespace-nowrap">{file.date}</td>
                                                                <td className="p-4">
                                                                    <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${file.status === 'Sanitized' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : 'bg-blue-50 text-blue-600 border border-blue-100'
                                                                        }`}>
                                                                        <span className={`w-1.5 h-1.5 rounded-full ${file.status === 'Sanitized' ? 'bg-emerald-500' : 'bg-blue-500'}`}></span>
                                                                        {file.status}
                                                                    </span>
                                                                </td>
                                                                <td className="p-4 pr-6 text-right">
                                                                    <div className="flex items-center justify-end gap-1">
                                                                        {file.maskedText && (
                                                                            <button onClick={() => setViewFile(file)} className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-bold rounded-lg hover:bg-emerald-100 transition-all shadow-sm">
                                                                                <Icons.Eye />
                                                                                View
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div className="p-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                                                <span>Showing {Math.min(files.length, 5)} of {files.length} entries</span>
                                                <div className="flex gap-1">
                                                    <button className="px-3 py-1 border border-slate-200 rounded hover:bg-slate-50 disabled:opacity-50" disabled>Prev</button>
                                                    <button className="px-3 py-1 bg-deepblue text-white rounded">1</button>
                                                    <button className="px-3 py-1 border border-slate-200 rounded hover:bg-slate-50">2</button>
                                                    <button className="px-3 py-1 border border-slate-200 rounded hover:bg-slate-50">Next</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Right Area: Recent Activity Panel */}
                                    <div className="glass-card bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-fit">
                                        <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                            <h3 className="text-lg font-bold text-slate-800">Your Activity</h3>
                                        </div>
                                        <div className="p-6">
                                            <div className="space-y-6 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-slate-200 before:to-transparent">

                                                {activities.map((act, idx) => {
                                                    const Icon = act.icon;
                                                    return (
                                                        <div key={idx} className="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group">
                                                            {/* Center Line Marker */}
                                                            <div className="flex items-center justify-center w-10 h-10 rounded-full bg-white border-4 border-slate-100 shadow-sm z-10 shrink-0 md:absolute md:left-1/2 md:-ml-5 group-hover:border-cyan-200 transition-colors">
                                                                <div className="text-slate-400 group-hover:text-cyan-600 transition-colors w-4 h-4 *:-m-0.5">
                                                                    <Icon width="20" height="20" />
                                                                </div>
                                                            </div>

                                                            {/* Content Card */}
                                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 w-[calc(100%-3rem)] md:w-[calc(50%-2rem)] shadow-sm hover:shadow transition-shadow ml-4 md:ml-0 group-hover:border-slate-200">
                                                                <h4 className="text-sm font-bold text-slate-700">{act.action}</h4>
                                                                <p className="text-xs text-slate-500 mt-1 truncate">{act.target}</p>
                                                                <p className="text-[10px] font-semibold text-slate-400 mt-2 uppercase tracking-wide">{act.time}</p>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>

                                            <button className="w-full mt-6 py-2.5 text-sm font-semibold text-deepblue bg-blue-50 rounded-xl hover:bg-blue-100 transition-colors border border-blue-100/50">
                                                View Complete History
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </main>

                    {/* ===== VIEW SANITIZED FILE MODAL ===== */}
                    {viewFile && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setViewFile(null)}></div>
                            <div className="relative bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[85vh] overflow-hidden flex flex-col">
                                <div className="bg-gradient-to-r from-deepblue to-cyan-600 p-6 text-white relative overflow-hidden shrink-0">
                                    <div className="absolute -top-8 -right-8 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                                    <div className="flex justify-between items-start relative z-10">
                                        <div>
                                            <h2 className="text-xl font-extrabold tracking-tight">Sanitized File Content</h2>
                                            <p className="text-cyan-100 text-sm mt-1 font-medium">{viewFile.name}</p>
                                        </div>
                                        <button onClick={() => setViewFile(null)} className="text-white/80 hover:text-white text-2xl font-bold transition-colors">&times;</button>
                                    </div>
                                    <div className="mt-3 flex items-center gap-3">
                                        <span className="px-3 py-1 rounded-lg text-[11px] font-bold bg-white/20 text-white">{viewFile.type}</span>
                                        {viewFile.entityCount > 0 && <span className="text-cyan-100 text-sm">PII Removed: <span className="font-bold text-white">{viewFile.entityCount} entities</span></span>}
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-6">
                                    <h3 className="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
                                        <span className="w-1 h-5 bg-emerald-500 rounded-full"></span>
                                        Sanitized Output (PII Removed)
                                    </h3>
                                    <div className="bg-slate-900 text-green-400 p-4 rounded-xl font-mono text-xs leading-relaxed max-h-[50vh] overflow-y-auto whitespace-pre-wrap border border-slate-700">
                                        {viewFile.maskedText || 'Sanitized content not available.'}
                                    </div>
                                </div>
                                <div className="border-t border-slate-200 p-4 flex justify-end shrink-0 bg-slate-50">
                                    <button onClick={() => setViewFile(null)} className="px-6 py-2.5 bg-gradient-to-r from-deepblue to-cyan-600 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all text-sm">Close</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UserDashboard />);
    </script>
</body>

</html>
