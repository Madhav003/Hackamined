<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deepblue: '#1E3A8A',
                        cyan: '#06B6D4',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px rgba(6,182,212,0.6))' },
                            '50%': { opacity: 0.7, filter: 'drop-shadow(0 0 2px rgba(6,182,212,0.2))' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            margin: 0;
            min-height: 100vh;
        }

        .bg-animated-gradient {
            background: linear-gradient(-45deg, #0f172a, #1E3A8A, #0B1120, #06B6D4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f172a;
        }

        ::-webkit-scrollbar-thumb {
            background: #1E3A8A;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #06B6D4;
        }
    </style>
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-200 antialiased min-h-screen bg-animated-gradient flex items-center justify-center p-4 sm:p-8">
    <div id="root" class="w-full max-w-6xl"></div>

    <script type="text/babel">
        const { useState } = React;

        // Custom Icon SVG Components
        const Icons = {
            User: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Mail: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            EyeOff: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Badge: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" /></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
        };

        const SignupPage = () => {
            const [showPassword, setShowPassword] = useState(false);
            const [showConfirmPassword, setShowConfirmPassword] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                password: '',
                confirmPassword: '',
                role: 'standard',
                agreeTerms: false
            });

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                // Validate passwords match
                if (formData.password !== formData.confirmPassword) {
                    setError('Passwords do not match.');
                    return;
                }
                if (formData.password.length < 6) {
                    setError('Password must be at least 6 characters.');
                    return;
                }

                setLoading(true);
                try {
                    // 1. Create user in Firebase Authentication
                    const userCredential = await window.createUserWithEmailAndPassword(
                        window.firebaseAuth, formData.email, formData.password
                    );
                    const user = userCredential.user;

                    // 2. Store additional user details in Firestore (NO password stored!)
                    await window.setDoc(window.doc(window.firebaseDb, "users", user.uid), {
                        name: formData.fullName,
                        email: formData.email,
                        role: formData.role,       // "admin" or "standard"
                        status: "Active",
                        createdAt: window.serverTimestamp()
                    });

                    // 3. Redirect based on role
                    if (formData.role === 'admin') {
                        window.location.href = 'Dashboard.html';
                    } else {
                        window.location.href = 'UserDashboard.html';
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    if (err.code === 'auth/email-already-in-use') {
                        setError('This email is already registered. Please login instead.');
                    } else if (err.code === 'auth/weak-password') {
                        setError('Password is too weak. Use at least 6 characters.');
                    } else if (err.code === 'auth/invalid-email') {
                        setError('Invalid email address format.');
                    } else {
                        setError(err.message || 'Signup failed. Please try again.');
                    }
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col lg:flex-row w-full bg-white/5 backdrop-blur-xl rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)] border border-white/10 min-h-[850px] lg:h-[800px] relative z-10 transition-all duration-500">

                    {/* Left Side - Illustration & Value Prop */}
                    <div className="w-full lg:w-[45%] p-10 lg:p-14 flex flex-col justify-between relative overflow-hidden bg-slate-900 shadow-[inset_0_0_100px_rgba(0,0,0,0.5)] border-r border-white/5">
                        {/* Glow Abstract Backgrounds */}
                        <div className="absolute top-[-10%] right-[-10%] w-64 h-64 rounded-full bg-cyan-500/20 blur-3xl pointer-events-none"></div>
                        <div className="absolute bottom-[-10%] left-[-10%] w-80 h-80 rounded-full bg-deepblue/40 blur-3xl pointer-events-none"></div>

                        {/* Logo / Header */}
                        <div className="relative z-10 flex items-center space-x-3 mb-10">
                            <div className="bg-cyan-500/10 p-2.5 rounded-xl border border-cyan-500/30 animate-pulse-glow">
                                <Icons.Shield />
                            </div>
                            <span className="text-xl font-bold tracking-wide text-white">
                                PII <span className="text-cyan-400">Sanitization</span>
                            </span>
                        </div>

                        {/* Text Content */}
                        <div className="relative z-10 mt-auto mb-auto lg:mt-0 xl:mt-16">
                            <h1 className="text-4xl lg:text-5xl font-extrabold text-white mb-6 leading-tight tracking-tight drop-shadow-lg">
                                Protect Sensitive <br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">Data with AI</span>
                            </h1>
                            <p className="text-slate-300 text-lg leading-relaxed max-w-md mb-12 font-light">
                                Automatically detect and sanitize personal identifiable information from documents, images, and datasets with high precision.
                            </p>

                            {/* Decorative Illustration / Dashboard Mock */}
                            <div className="relative mt-8 animate-float">
                                <div className="glass-panel p-5 rounded-2xl relative shadow-2xl">
                                    <div className="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
                                        <div className="flex space-x-2.5">
                                            <div className="w-3.5 h-3.5 rounded-full bg-slate-700"></div>
                                            <div className="w-3.5 h-3.5 rounded-full bg-slate-700"></div>
                                            <div className="w-3.5 h-3.5 rounded-full bg-slate-700"></div>
                                        </div>
                                        <div className="text-xs text-cyan-400 font-mono tracking-wider flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></div>
                                            REAL-TIME SCAN
                                        </div>
                                    </div>
                                    <div className="font-mono text-[13px] text-slate-300 space-y-3 relative leading-relaxed">
                                        <div className="flex items-center justify-between bg-white/5 p-2 rounded-lg">
                                            <div><span className="text-pink-400">"fullName"</span>: <span className="text-white line-through opacity-50">"Sarah Connor"</span></div>
                                            <div className="text-cyan-400 flex items-center gap-1"><Icons.Check /> REDACTED</div>
                                        </div>
                                        <div className="flex items-center justify-between bg-white/5 p-2 rounded-lg">
                                            <div><span className="text-pink-400">"ccn"</span>: <span className="text-white line-through opacity-50">"4532-XXXX-XXXX"</span></div>
                                            <div className="text-cyan-400 flex items-center gap-1"><Icons.Check /> REDACTED</div>
                                        </div>
                                        <div className="flex items-center justify-between bg-white/5 p-2 rounded-lg">
                                            <div><span className="text-pink-400">"document"</span>: <span className="text-slate-400">"invoice_001.pdf"</span></div>
                                            <div className="text-green-400 flex items-center gap-1"> SAFE </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Footer text */}
                        <div className="relative z-10 mt-12 text-sm text-slate-500 font-medium">
                            &copy; 2026 CoreGuard Security.
                        </div>
                    </div>

                    {/* Right Side - Signup Form */}
                    <div className="w-full lg:w-[55%] p-8 lg:p-14 bg-white relative flex flex-col justify-center">
                        <div className="max-w-md w-full mx-auto">
                            <div className="mb-10 text-center lg:text-left">
                                <h2 className="text-3xl font-extrabold text-slate-900 mb-3 tracking-tight">Create an account</h2>
                                <p className="text-slate-500 text-lg">Join the platform to secure your data pipeline.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-5">

                                {/* Full Name */}
                                <div className="space-y-1.5 relative group">
                                    <label className="text-sm font-semibold text-slate-700 ml-1">Full Name</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-deepblue transition-colors">
                                            <Icons.User />
                                        </div>
                                        <input
                                            type="text"
                                            name="fullName"
                                            value={formData.fullName}
                                            onChange={handleChange}
                                            className="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-deepblue/20 focus:border-deepblue focus:bg-white transition-all duration-300 shadow-sm"
                                            placeholder="Jane Doe"
                                            required
                                        />
                                    </div>
                                </div>

                                {/* Email Address */}
                                <div className="space-y-1.5 relative group">
                                    <label className="text-sm font-semibold text-slate-700 ml-1">Email Address</label>
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-deepblue transition-colors">
                                            <Icons.Mail />
                                        </div>
                                        <input
                                            type="email"
                                            name="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            className="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-deepblue/20 focus:border-deepblue focus:bg-white transition-all duration-300 shadow-sm"
                                            placeholder="jane@company.com"
                                            required
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                    {/* Password */}
                                    <div className="space-y-1.5 relative group">
                                        <label className="text-sm font-semibold text-slate-700 ml-1">Password</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-deepblue transition-colors">
                                                <Icons.Lock />
                                            </div>
                                            <input
                                                type={showPassword ? "text" : "password"}
                                                name="password"
                                                value={formData.password}
                                                onChange={handleChange}
                                                className="block w-full pl-11 pr-12 py-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-deepblue/20 focus:border-deepblue focus:bg-white transition-all duration-300 shadow-sm"
                                                placeholder="••••••••"
                                                required
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowPassword(!showPassword)}
                                                className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-deepblue transition-colors focus:outline-none"
                                            >
                                                {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                                            </button>
                                        </div>
                                    </div>

                                    {/* Confirm Password */}
                                    <div className="space-y-1.5 relative group">
                                        <label className="text-sm font-semibold text-slate-700 ml-1">Confirm Password</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-deepblue transition-colors">
                                                <Icons.Lock />
                                            </div>
                                            <input
                                                type={showConfirmPassword ? "text" : "password"}
                                                name="confirmPassword"
                                                value={formData.confirmPassword}
                                                onChange={handleChange}
                                                className="block w-full pl-11 pr-12 py-3.5 border border-slate-200 rounded-xl bg-slate-50 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-deepblue/20 focus:border-deepblue focus:bg-white transition-all duration-300 shadow-sm"
                                                placeholder="••••••••"
                                                required
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                                                className="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-deepblue transition-colors focus:outline-none"
                                            >
                                                {showConfirmPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Role Selection Toggle */}
                                <div className="space-y-2">
                                    <label className="text-sm font-semibold text-slate-700 ml-1">Account Role</label>
                                    <div className="flex p-1.5 space-x-1 bg-slate-100/80 rounded-xl border border-slate-200/60 shadow-inner">
                                        <button
                                            type="button"
                                            onClick={() => setFormData(prev => ({ ...prev, role: 'standard' }))}
                                            className={`flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-bold rounded-lg transition-all duration-300 ${formData.role === 'standard' ? 'bg-white text-deepblue shadow-[0_2px_8px_rgba(0,0,0,0.08)]' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}
                                        >
                                            <Icons.User />
                                            <span>Standard User</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setFormData(prev => ({ ...prev, role: 'admin' }))}
                                            className={`flex-1 flex items-center justify-center space-x-2 py-2.5 text-sm font-bold rounded-lg transition-all duration-300 ${formData.role === 'admin' ? 'bg-white text-deepblue shadow-[0_2px_8px_rgba(0,0,0,0.08)]' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}
                                        >
                                            <Icons.Badge />
                                            <span>Admin</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Terms Checkbox */}
                                <div className="flex items-start mt-6 pt-2">
                                    <div className="flex items-center h-5 mt-0.5">
                                        <input
                                            id="agreeTerms"
                                            name="agreeTerms"
                                            type="checkbox"
                                            checked={formData.agreeTerms}
                                            onChange={handleChange}
                                            className="w-4 h-4 border border-slate-300 rounded bg-white focus:ring-2 focus:ring-deepblue/30 checked:bg-deepblue checked:border-deepblue text-deepblue transition duration-200 cursor-pointer shadow-sm"
                                            required
                                        />
                                    </div>
                                    <label htmlFor="agreeTerms" className="ml-3 text-sm text-slate-600 cursor-pointer select-none leading-relaxed">
                                        I agree to the <a href="#" className="font-semibold text-deepblue hover:text-cyan-600 transition-colors">Terms of Service</a> and <a href="#" className="font-semibold text-deepblue hover:text-cyan-600 transition-colors">Privacy Policy</a>
                                    </label>
                                </div>

                                {/* Error Message */}
                                {error && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-medium">
                                        {error}
                                    </div>
                                )}

                                {/* Submit Button */}
                                <div className="pt-4">
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="w-full flex justify-center py-4 px-4 border border-transparent rounded-xl shadow-[0_8px_20px_rgba(30,58,138,0.3)] text-[15px] font-bold text-white bg-gradient-to-r from-deepblue to-cyan-600 hover:from-blue-800 hover:to-cyan-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-deepblue transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
                                    >
                                        {loading ? 'Creating Account...' : 'Create Account'}
                                    </button>
                                </div>
                            </form>

                            {/* Login Link */}
                            <div className="mt-8 text-center text-sm text-slate-600">
                                Already have an account?{' '}
                                <a href="Login.html" className="font-bold text-deepblue hover:text-cyan-600 transition-colors">
                                    Login here
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SignupPage />);
    </script>
</body>

</html>
