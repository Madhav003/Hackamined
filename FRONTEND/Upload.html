<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - Upload Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { deepblue: '#1E3A8A', cyan: '#06B6D4', lightbg: '#F8FAFC' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'float': 'float 4s ease-in-out infinite' },
                    keyframes: { float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-8px)' } } }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
        }

        .dark-glass {
            background: linear-gradient(145deg, #1E3A8A, #152C6B);
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.05);
        }

        .dropzone {
            transition: all 0.3s ease;
        }

        .dropzone.drag-active {
            border-color: #06B6D4 !important;
            background: rgba(6, 182, 212, 0.06) !important;
            transform: scale(1.015);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        .progress-bar-striped {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, .15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progressStripes 1s linear infinite;
        }

        @keyframes progressStripes {
            0% {
                background-position: 1rem 0;
            }

            100% {
                background-position: 0 0;
            }
        }

        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-800 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        /* ==================== ICONS ==================== */
        const Icons = {
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            CloudUpload: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Spinner: () => <svg className="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>,
        };

        const fileTypeColors = {
            PDF: 'bg-rose-100 text-rose-600', SQL: 'bg-indigo-100 text-indigo-600', CSV: 'bg-emerald-100 text-emerald-600',
            JSON: 'bg-amber-100 text-amber-600', TXT: 'bg-slate-100 text-slate-600', DOCX: 'bg-blue-100 text-blue-600',
            XLSX: 'bg-green-100 text-green-600', PNG: 'bg-purple-100 text-purple-600', JPG: 'bg-purple-100 text-purple-600',
            JPEG: 'bg-purple-100 text-purple-600',
        };

        const statusStyles = {
            'Uploading': 'bg-blue-100 text-blue-700 border-blue-200',
            'Uploaded': 'bg-blue-50 text-blue-600 border-blue-100',
            'Pending': 'bg-slate-100 text-slate-600 border-slate-200',
            'Scanning': 'bg-cyan-100 text-cyan-700 border-cyan-200',
            'Completed': 'bg-emerald-100 text-emerald-700 border-emerald-200',
            'Error': 'bg-red-100 text-red-700 border-red-200',
        };

        /* ==================== MAIN COMPONENT ==================== */
        const UploadFilesPage = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const activeMenu = 'Upload Files';
            const fileInputRef = useRef(null);
            const [userName, setUserName] = useState('Admin User');

            const [dragActive, setDragActive] = useState(false);
            const [uploadingFiles, setUploadingFiles] = useState([]);
            const [queueFiles, setQueueFiles] = useState([]);
            const [uploadError, setUploadError] = useState('');

            const allowedExts = ['.sql', '.pdf', '.docx', '.csv', '.json', '.txt', '.png', '.jpg', '.jpeg', '.xlsx'];

            // Auth guard + real-time queue listener
            useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(checkAuth);
                    window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (!user) { window.location.href = 'Login.html'; return; }
                        const userDoc = await window.getDoc(window.doc(window.firebaseDb, 'users', user.uid));
                        if (!userDoc.exists() || (userDoc.data().role || '').toLowerCase() !== 'admin') { window.location.href = 'UserDashboard.html'; return; }
                        setUserName(userDoc.data().name || 'Admin User');

                        // Live listener on files collection
                        window.onSnapshot(
                            window.query(window.collection(window.firebaseDb, 'files'), window.orderBy('uploadTime', 'desc')),
                            (snapshot) => {
                                const files = snapshot.docs.map(d => {
                                    const data = d.data();
                                    const t = data.uploadTime && data.uploadTime.toDate ? data.uploadTime.toDate() : new Date();
                                    return {
                                        id: d.id,
                                        fileName: data.fileName,
                                        fileType: data.fileName.split('.').pop().toUpperCase(),
                                        fileSize: formatBytes(data.fileSize || 0),
                                        uploadTime: t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                                        scanStatus: data.status === 'completed' ? 'Completed' : data.status === 'processing' ? 'Scanning' : 'Pending',
                                    };
                                });
                                setQueueFiles(files);
                            }
                        );
                    });
                }, 100);
                return () => clearInterval(checkAuth);
            }, []);

            const handleLogout = async () => {
                try { await window.signOut(window.firebaseAuth); window.location.href = 'Login.html'; } catch (e) { console.error(e); }
            };

            const menuItems = [
                { name: 'Dashboard', icon: Icons.LayoutDashboard, href: 'Dashboard.html' },
                { name: 'Upload Files', icon: Icons.Upload, href: 'Upload.html' },
                { name: 'View Files', icon: Icons.Eye, href: 'ViewFiles.html' },
                { name: 'Manage Users', icon: Icons.Users, href: 'ManageUsers.html' },
                { name: 'Audit Logs', icon: Icons.ClipboardList, href: 'AuditLogs.html' },
                { name: 'Download PII', icon: Icons.Download, href: 'DownloadPII.html' },
                { name: 'Statistical Analysis', icon: Icons.BarChart, href: 'StatisticalAnalysis.html' },
            ];

            const formatBytes = (bytes) => {
                if (!bytes) return '0 B';
                const k = 1024, s = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
            };

            const validateFile = (file) => {
                const ext = '.' + file.name.split('.').pop().toLowerCase();
                if (!allowedExts.includes(ext)) return false;
                if (file.size > 750 * 1024) return false;
                return true;
            };

            const handleDrag = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(e.type === "dragenter" || e.type === "dragover"); };
            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); setDragActive(false); if (e.dataTransfer.files && e.dataTransfer.files[0]) processFiles(Array.from(e.dataTransfer.files)); };
            const handleChange = (e) => { e.preventDefault(); if (e.target.files && e.target.files[0]) processFiles(Array.from(e.target.files)); };

            const processFiles = (files) => {
                const valid = [], invalid = [];
                files.forEach(f => validateFile(f) ? valid.push(f) : invalid.push(f.name));
                if (invalid.length) alert('Rejected: ' + invalid.join(', ') + '\nSupported: SQL, PDF, DOCX, CSV, JSON, TXT, XLSX, PNG, JPG (max 750 KB)');
                valid.forEach(f => uploadFile(f));
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const uploadFile = async (file) => {
                const id = Math.random().toString(36).substring(7);
                setUploadError('');

                // Firestore document max is 1MB; limit file to 750KB to leave room for other fields
                if (file.size > 750 * 1024) {
                    setUploadError('File "' + file.name + '" is too large. Max 750 KB per file (Firestore limit). Consider compressing the file first.');
                    return;
                }

                setUploadingFiles(prev => [...prev, { id, file, progress: 0 }]);

                try {
                    // Read file as base64
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => reject(reader.error);
                        reader.onprogress = (e) => {
                            if (e.lengthComputable) {
                                const progress = Math.round((e.loaded / e.total) * 50);
                                setUploadingFiles(prev => prev.map(u => u.id === id ? { ...u, progress } : u));
                            }
                        };
                        reader.readAsDataURL(file);
                    });

                    // Update progress to 50% (reading done)
                    setUploadingFiles(prev => prev.map(u => u.id === id ? { ...u, progress: 50 } : u));

                    // Save to Firestore with base64 data
                    const currentUser = window.firebaseAuth.currentUser;
                    await window.addDoc(window.collection(window.firebaseDb, 'files'), {
                        fileName: file.name,
                        uploadedBy: currentUser ? currentUser.email : 'Unknown',
                        uploadTime: window.serverTimestamp(),
                        fileData: base64Data,
                        originalFileURL: '',
                        sanitizedFileURL: '',
                        status: 'uploaded',
                        fileSize: file.size
                    });

                    // Done
                    setUploadingFiles(prev => prev.map(u => u.id === id ? { ...u, progress: 100 } : u));
                    console.log('File saved to Firestore successfully:', file.name);

                    // Remove from uploading list after brief delay
                    setTimeout(() => {
                        setUploadingFiles(prev => prev.filter(u => u.id !== id));
                    }, 800);
                } catch (e) {
                    console.error('Upload error:', e);
                    setUploadError('Upload failed for "' + file.name + '": ' + (e.code || e.message));
                    setUploadingFiles(prev => prev.filter(u => u.id !== id));
                }
            };

            const removeFile = async (docId) => {
                try {
                    await window.deleteDoc(window.doc(window.firebaseDb, 'files', docId));
                } catch (e) {
                    console.error('Delete error:', e);
                    setQueueFiles(prev => prev.filter(d => d.id !== docId));
                }
            };

            return (
                <div className="flex h-screen w-full bg-slate-50 relative">
                    {sidebarOpen ? <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div> : null}

                    {/* SIDEBAR */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 dark-glass text-white flex flex-col sidebar-transition ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none`}>
                        <div className="h-20 flex items-center px-6 border-b border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <Icons.Shield />
                            <div className="ml-3 flex flex-col"><span className="text-lg font-extrabold tracking-wide leading-tight">PII Sanitization</span><span className="text-xs text-cyan-400 font-medium tracking-wider">SYSTEM</span></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 ml-2">Main Menu</div>
                            {menuItems.map(item => (
                                <button key={item.name} onClick={() => { if (item.name !== activeMenu) window.location.href = item.href; }} className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-300 ${item.name === activeMenu ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)] font-semibold' : 'text-slate-300 hover:bg-white/5 hover:text-white font-medium cursor-pointer'}`}>
                                    <item.icon /><span className="ml-3.5">{item.name}</span>
                                    {item.name === activeMenu ? <div className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,1)]"></div> : null}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/10"><button onClick={handleLogout} className="w-full flex items-center px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><Icons.LogOut /><span className="ml-3.5 font-medium">Logout</span></button></div>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-100/40 rounded-full blur-[100px] pointer-events-none -z-10 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] pointer-events-none -z-10 translate-y-1/3 -translate-x-1/3"></div>

                        {/* NAVBAR */}
                        <header className="h-20 glass-card border-b border-slate-200/60 shadow-sm flex items-center justify-between px-6 lg:px-10 z-10 shrink-0 sticky top-0">
                            <div className="flex items-center">
                                <button className="lg:hidden text-slate-500 hover:text-deepblue mr-4 transition-colors p-1" onClick={() => setSidebarOpen(true)}><Icons.Menu /></button>
                                <h1 className="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight">Upload Files</h1>
                            </div>
                            <div className="flex items-center space-x-5 lg:space-x-7">
                                <button className="relative text-slate-500 hover:text-deepblue transition-colors p-1"><Icons.Bell /><span className="absolute top-0 right-0 h-2.5 w-2.5 bg-red-500 border-2 border-white rounded-full"></span></button>
                                <div className="flex items-center space-x-3 cursor-pointer pl-2 border-l border-slate-200">
                                    <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-deepblue to-cyan-500 p-[2px]"><div className="w-full h-full rounded-full border-2 border-white bg-white flex items-center justify-center"><svg className="w-5 h-5 text-slate-300 mt-1" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd"></path></svg></div></div>
                                    <div className="hidden lg:block text-left"><div className="text-sm font-semibold text-slate-700 leading-tight">{userName}</div><div className="text-[11px] text-slate-500 font-medium">Platform Admin</div></div>
                                </div>
                            </div>
                        </header>

                        {/* SCROLLABLE CONTENT */}
                        <div className="flex-1 overflow-y-auto p-6 lg:p-10 pb-24 relative z-0">
                            <div className="max-w-5xl mx-auto space-y-8">

                                {/* Error Banner */}
                                {uploadError && (
                                    <div className="bg-red-50 border border-red-200 p-4 rounded-xl flex items-start space-x-3 shadow-sm">
                                        <div className="text-red-500 mt-0.5 shrink-0"><svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg></div>
                                        <div className="flex-1"><h3 className="text-sm font-bold text-red-800">Upload Issue</h3><p className="text-xs text-red-700 mt-0.5">{uploadError}</p></div>
                                        <button onClick={() => setUploadError('')} className="text-red-400 hover:text-red-600 text-lg font-bold">&times;</button>
                                    </div>
                                )}

                                {/* HEADER */}
                                <div>
                                    <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">Upload Files for PII Detection</h2>
                                    <p className="text-slate-500 text-[15px] mt-2 max-w-2xl leading-relaxed">
                                        Upload documents that may contain sensitive personal information. The system will automatically scan and sanitize PII using AI-powered detection.
                                    </p>
                                </div>

                                {/* UPLOAD AREA + INFO */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-2 space-y-6">
                                        {/* Drag and Drop */}
                                        <div
                                            className={`glass-card p-10 lg:p-14 rounded-2xl border-2 border-dashed flex flex-col items-center justify-center dropzone cursor-pointer group relative ${dragActive ? 'drag-active' : 'border-slate-300 hover:border-cyan-400'}`}
                                            onDragEnter={handleDrag} onDragLeave={handleDrag} onDragOver={handleDrag} onDrop={handleDrop}
                                            onClick={() => fileInputRef.current && fileInputRef.current.click()}
                                        >
                                            <input ref={fileInputRef} type="file" className="hidden" multiple onChange={handleChange} accept=".sql,.pdf,.docx,.csv,.json,.txt,.png,.jpg,.jpeg,.xlsx" />
                                            <div className="w-24 h-24 bg-gradient-to-br from-blue-50 to-cyan-50 rounded-full flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300 text-deepblue/50 group-hover:text-cyan-500">
                                                <Icons.CloudUpload />
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-700 mb-2">{"Drag & Drop files here or click to browse"}</h3>
                                            <p className="text-slate-400 text-sm mb-6">{"Upload multiple files at once \u2022 Maximum file size: "}<span className="font-semibold text-slate-500">25MB</span></p>
                                            <button className="px-7 py-2.5 bg-gradient-to-r from-deepblue to-cyan-600 hover:from-blue-800 hover:to-cyan-500 text-white font-semibold rounded-xl shadow-lg hover:shadow-[0_4px_20px_rgba(6,182,212,0.4)] transition-all pointer-events-none">
                                                Browse Files
                                            </button>
                                            <div className="mt-8 flex flex-wrap justify-center gap-2">
                                                {['SQL', 'PDF', 'DOCX', 'CSV', 'JSON', 'TXT', 'XLSX', 'PNG', 'JPG'].map(t => (
                                                    <span key={t} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${fileTypeColors[t] || 'bg-slate-100 text-slate-500'}`}>{t}</span>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Active Uploads */}
                                        {uploadingFiles.length > 0 ? (
                                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                                                <h4 className="text-sm font-bold text-slate-700 flex items-center gap-2"><Icons.Spinner /> {"Uploading " + uploadingFiles.length + " file" + (uploadingFiles.length > 1 ? "s" : "") + "..."}</h4>
                                                {uploadingFiles.map(u => (
                                                    <div key={u.id} className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <div className="flex items-center space-x-3 min-w-0">
                                                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-[10px] font-bold shrink-0 ${fileTypeColors[u.file.name.split('.').pop().toUpperCase()] || 'bg-slate-100 text-slate-500'}`}>{u.file.name.split('.').pop().toUpperCase()}</div>
                                                                <span className="text-sm font-semibold text-slate-700 truncate">{u.file.name}</span>
                                                            </div>
                                                            <span className="text-xs font-bold text-deepblue ml-3 shrink-0">{u.progress}%</span>
                                                        </div>
                                                        <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                                            <div className="bg-gradient-to-r from-deepblue to-cyan-500 h-2 rounded-full progress-bar-striped transition-all duration-300 ease-out" style={{ width: u.progress + '%' }}></div>
                                                        </div>
                                                        <div className="flex justify-between text-[10px] text-slate-400 font-medium mt-1.5">
                                                            <span>{formatBytes(u.file.size)}</span>
                                                            <span>Uploading</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ) : null}
                                    </div>

                                    {/* Info Cards */}
                                    <div className="space-y-6">
                                        <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl shadow-sm relative overflow-hidden">
                                            <div className="absolute -top-4 -right-4 opacity-5"><svg className="h-24 w-24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg></div>
                                            <div className="mb-3 text-indigo-500"><Icons.Shield /></div>
                                            <h3 className="text-sm font-bold text-indigo-900 mb-2">Security Protocol</h3>
                                            <p className="text-xs text-indigo-700 leading-relaxed font-medium">All uploaded files are <span className="font-bold">encrypted at rest</span> and isolated in a secure sandbox. Only sanitized outputs are made available to standard users.</p>
                                        </div>

                                        <div className="glass-card bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <h3 className="text-sm font-bold text-slate-800 mb-4">Connection</h3>
                                            <div className="flex items-center space-x-3">
                                                <div className="w-3 h-3 rounded-full bg-amber-400 shadow-amber-400/50 shadow-[0_0_6px]"></div>
                                                <span className="text-sm font-medium text-slate-600">Local Demo Mode</span>
                                            </div>
                                        </div>

                                        <div className="glass-card bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                            <h3 className="text-sm font-bold text-slate-800 mb-3">Supported Formats</h3>
                                            <div className="flex flex-wrap gap-1.5">
                                                {Object.entries(fileTypeColors).filter(function (entry) { return entry[0] !== 'JPEG'; }).map(function (entry) {
                                                    return <span key={entry[0]} className={`px-2.5 py-1 rounded-lg text-[11px] font-bold ${entry[1]}`}>{entry[0]}</span>;
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* FILE QUEUE TABLE */}
                                <div className="glass-card bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                                        <h3 className="text-lg font-bold text-slate-800">Uploaded Files Queue</h3>
                                        <span className="text-xs font-semibold px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-slate-500 shadow-sm">{queueFiles.length + " file" + (queueFiles.length !== 1 ? "s" : "")}</span>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="bg-slate-50/80 border-b border-slate-200 text-[11px] uppercase tracking-wider text-slate-500 font-semibold">
                                                    <th className="p-4 pl-6">File Name</th>
                                                    <th className="p-4">Type</th>
                                                    <th className="p-4">Size</th>
                                                    <th className="p-4">Upload Time</th>
                                                    <th className="p-4">Status</th>
                                                    <th className="p-4 pr-6 text-right">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {queueFiles.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="6" className="p-12 text-center">
                                                            <div className="flex flex-col items-center text-slate-400">
                                                                <svg className="h-12 w-12 mb-3 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                                                                <p className="font-semibold text-slate-500">No files uploaded yet.</p>
                                                                <p className="text-xs mt-1">Upload files to start PII detection.</p>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                ) : queueFiles.map(doc => {
                                                    const tc = fileTypeColors[doc.fileType] || 'bg-slate-100 text-slate-500';
                                                    const sc = statusStyles[doc.scanStatus] || statusStyles['Pending'];
                                                    return (
                                                        <tr key={doc.id} className="hover:bg-slate-50/60 transition-colors group">
                                                            <td className="p-4 pl-6">
                                                                <div className="flex items-center space-x-3">
                                                                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center text-[10px] font-bold shrink-0 ${tc}`}>{doc.fileType}</div>
                                                                    <span className="font-medium text-slate-800 truncate max-w-[200px]">{doc.fileName}</span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4"><span className={`text-[11px] font-bold px-2 py-1 rounded-lg ${tc}`}>{doc.fileType}</span></td>
                                                            <td className="p-4 text-slate-500 text-xs font-medium">{doc.fileSize || '\u2014'}</td>
                                                            <td className="p-4 text-slate-500 text-xs font-medium">{doc.uploadTime}</td>
                                                            <td className="p-4">
                                                                <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${sc}`}>
                                                                    {doc.scanStatus === 'Scanning' ? <span className="w-1.5 h-1.5 bg-cyan-500 rounded-full animate-pulse"></span> : null}
                                                                    {doc.scanStatus}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 pr-6 text-right">
                                                                <button onClick={() => removeFile(doc.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Remove"><Icons.Trash /></button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UploadFilesPage />);
    </script>
</body>

</html>
