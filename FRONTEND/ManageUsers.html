<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Sanitization System - User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { deepblue: '#1E3A8A', cyan: '#06B6D4', lightbg: '#F8FAFC' },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #F8FAFC;
            margin: 0;
            overflow-x: hidden;
        }

        .dark-glass {
            background: linear-gradient(145deg, #1E3A8A, #152C6B);
            box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px -10px rgba(30, 58, 138, 0.05);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .modal-backdrop {
            animation: fadeIn 0.2s ease;
        }

        .modal-panel {
            animation: slideUp 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>



    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Firebase Config -->
    <script type="module" src="firebaseConfig.js"></script>
</head>

<body class="text-slate-800 antialiased h-screen flex overflow-hidden">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // ==================== ICONS ====================
        const Icons = {
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            BarChart: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Menu: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" /></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Shield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Filter: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" /></svg>,
            Plus: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
            Ban: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" /></svg>,
            Check: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            X: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>,
            UsersLrg: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            UserShield: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            UserStd: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" className="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        };

        const ITEMS_PER_PAGE = 6;

        // ==================== MAIN COMPONENT ====================
        const UserManagementPage = () => {
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const activeMenu = 'Manage Users';
            const [userName, setUserName] = useState('Admin User');

            const [users, setUsers] = useState([]);

            const [search, setSearch] = useState('');
            const [filterRole, setFilterRole] = useState('All');
            const [filterStatus, setFilterStatus] = useState('All');
            const [currentPage, setCurrentPage] = useState(1);

            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('add');
            const [editingUser, setEditingUser] = useState(null);
            const [form, setForm] = useState({ name: '', email: '', password: '', role: 'Standard User' });
            const [saving, setSaving] = useState(false);

            const [deleteConfirm, setDeleteConfirm] = useState(null);

            // Auth guard + real-time users listener
            React.useEffect(() => {
                const checkAuth = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(checkAuth);
                    window.onAuthStateChanged(window.firebaseAuth, async (user) => {
                        if (!user) { window.location.href = 'Login.html'; return; }
                        const uDoc = await window.getDoc(window.doc(window.firebaseDb, 'users', user.uid));
                        if (!uDoc.exists() || (uDoc.data().role || '').toLowerCase() !== 'admin') { window.location.href = 'UserDashboard.html'; return; }
                        setUserName(uDoc.data().name || 'Admin User');

                        // Live listener on users collection
                        window.onSnapshot(window.collection(window.firebaseDb, 'users'), (snapshot) => {
                            const list = snapshot.docs.map(d => {
                                const data = d.data();
                                const created = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
                                const roleLabel = data.role === 'admin' ? 'Admin' : 'Standard User';
                                return {
                                    id: d.id,
                                    name: data.name || '',
                                    email: data.email || '',
                                    role: roleLabel,
                                    status: data.status || 'Active',
                                    lastLogin: data.lastLogin || '—',
                                    createdAt: created ? created.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—',
                                };
                            });
                            setUsers(list);
                        });
                    });
                }, 100);
                return () => clearInterval(checkAuth);
            }, []);

            const handleLogout = async () => {
                try { await window.signOut(window.firebaseAuth); window.location.href = 'Login.html'; } catch (e) { console.error(e); }
            };

            const menuItems = [
                { name: 'Dashboard', icon: Icons.LayoutDashboard, href: 'Dashboard.html' },
                { name: 'Upload Files', icon: Icons.Upload, href: 'Upload.html' },
                { name: 'View Files', icon: Icons.Eye, href: 'ViewFiles.html' },
                { name: 'Manage Users', icon: Icons.Users, href: 'ManageUsers.html' },
                { name: 'Audit Logs', icon: Icons.ClipboardList, href: 'AuditLogs.html' },
                { name: 'Download PII', icon: Icons.Download, href: 'DownloadPII.html' },
                { name: 'Statistical Analysis', icon: Icons.BarChart, href: 'StatisticalAnalysis.html' },
            ];

            // Stats computed dynamically
            const stats = [
                { label: 'Total Users', value: users.length, icon: Icons.UsersLrg, color: 'blue' },
                { label: 'Admin Users', value: users.filter(u => u.role === 'Admin').length, icon: Icons.UserShield, color: 'purple' },
                { label: 'Standard Users', value: users.filter(u => u.role === 'Standard User').length, icon: Icons.UserStd, color: 'cyan' },
                { label: 'Active Users', value: users.filter(u => u.status === 'Active').length, icon: Icons.Clock, color: 'emerald' },
            ];

            // Filtering
            const filtered = useMemo(() => {
                return users.filter(u => {
                    const q = search.toLowerCase();
                    const matchSearch = !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
                    const matchRole = filterRole === 'All' || u.role === filterRole;
                    const matchStatus = filterStatus === 'All' || u.status === filterStatus;
                    return matchSearch && matchRole && matchStatus;
                });
            }, [users, search, filterRole, filterStatus]);

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            const paginated = filtered.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

            // Actions
            const openAddModal = () => { setModalMode('add'); setForm({ name: '', email: '', password: '', role: 'Standard User' }); setEditingUser(null); setShowModal(true); };
            const openEditModal = (user) => { setModalMode('edit'); setForm({ name: user.name, email: user.email, password: '', role: user.role }); setEditingUser(user); setShowModal(true); };

            const handleSave = async () => {
                if (!form.name || !form.email) return alert('Name and email are required.');
                if (modalMode === 'add' && !form.password) return alert('Password is required for new users.');
                setSaving(true);
                try {
                    const roleVal = form.role === 'Admin' ? 'admin' : 'standard';
                    if (modalMode === 'add') {
                        // Create user in Firebase Auth + Firestore
                        const cred = await window.createUserWithEmailAndPassword(window.firebaseAuth, form.email, form.password);
                        await window.setDoc(window.doc(window.firebaseDb, 'users', cred.user.uid), {
                            name: form.name, email: form.email, role: roleVal, status: 'Active', createdAt: window.serverTimestamp()
                        });
                        // Re-login as current admin (creating user signs in as that user)
                        // Note: this is a known limitation of client-side Firebase Auth
                    } else {
                        await window.updateDoc(window.doc(window.firebaseDb, 'users', editingUser.id), {
                            name: form.name, email: form.email, role: roleVal
                        });
                    }
                    setShowModal(false);
                } catch (e) {
                    console.error('Save error:', e);
                    alert(e.message || 'Operation failed.');
                }
                setSaving(false);
            };

            const toggleStatus = async (user) => {
                const newStatus = user.status === 'Active' ? 'Disabled' : 'Active';
                try {
                    await window.updateDoc(window.doc(window.firebaseDb, 'users', user.id), { status: newStatus });
                } catch (e) { console.error('Toggle error:', e); }
            };

            const deleteUser = async (id) => {
                try {
                    await window.deleteDoc(window.doc(window.firebaseDb, 'users', id));
                } catch (e) { console.error('Delete error:', e); }
                setDeleteConfirm(null);
            };

            const avatarColors = ['from-deepblue to-cyan-500', 'from-purple-500 to-indigo-500', 'from-emerald-500 to-teal-500', 'from-rose-500 to-pink-500', 'from-amber-500 to-orange-500'];

            // ==================== RENDER ====================
            return (
                <div className="flex h-screen w-full bg-slate-50 relative">
                    {sidebarOpen ? <div className="fixed inset-0 bg-slate-900/50 z-40 lg:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div> : null}

                    {/* SIDEBAR */}
                    <aside className={`fixed lg:static inset-y-0 left-0 z-50 w-72 dark-glass text-white flex flex-col sidebar-transition ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} shadow-2xl lg:shadow-none`}>
                        <div className="h-20 flex items-center px-6 border-b border-white/10 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl transform translate-x-10 -translate-y-10"></div>
                            <Icons.Shield />
                            <div className="ml-3 flex flex-col"><span className="text-lg font-extrabold tracking-wide leading-tight">PII Sanitization</span><span className="text-xs text-cyan-400 font-medium tracking-wider">SYSTEM</span></div>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1.5">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-4 ml-2">Main Menu</div>
                            {menuItems.map(item => (
                                <button key={item.name} onClick={() => { if (item.name !== activeMenu) window.location.href = item.href; }} className={`w-full flex items-center px-4 py-3.5 rounded-xl transition-all duration-300 ${item.name === activeMenu ? 'bg-gradient-to-r from-cyan-500/20 to-blue-600/20 text-cyan-300 border border-cyan-500/30 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)] font-semibold' : 'text-slate-300 hover:bg-white/5 hover:text-white font-medium cursor-pointer'}`}>
                                    <item.icon /><span className="ml-3.5">{item.name}</span>
                                    {item.name === activeMenu ? <div className="ml-auto w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_rgba(6,182,212,1)]"></div> : null}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-white/10"><button onClick={handleLogout} className="w-full flex items-center px-4 py-3 rounded-xl text-slate-300 hover:bg-white/5 transition-all"><Icons.LogOut /><span className="ml-3.5 font-medium">Logout</span></button></div>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-100/40 rounded-full blur-[100px] pointer-events-none -z-10 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-[600px] h-[600px] bg-blue-100/30 rounded-full blur-[120px] pointer-events-none -z-10 translate-y-1/3 -translate-x-1/3"></div>

                        {/* NAVBAR */}
                        <header className="h-20 glass-card border-b border-slate-200/60 shadow-sm flex items-center justify-between px-6 lg:px-10 z-10 shrink-0 sticky top-0">
                            <div className="flex items-center">
                                <button className="lg:hidden text-slate-500 hover:text-deepblue mr-4 p-1" onClick={() => setSidebarOpen(true)}><Icons.Menu /></button>
                                <h1 className="text-xl lg:text-2xl font-bold text-slate-800 tracking-tight">User Management</h1>
                            </div>
                            <div className="flex items-center space-x-5 lg:space-x-7">
                                <button className="relative text-slate-500 hover:text-deepblue transition-colors p-1"><Icons.Bell /><span className="absolute top-0 right-0 h-2.5 w-2.5 bg-red-500 border-2 border-white rounded-full"></span></button>
                                <div className="flex items-center space-x-3 cursor-pointer pl-2 border-l border-slate-200">
                                    <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-deepblue to-cyan-500 p-[2px]"><div className="w-full h-full rounded-full border-2 border-white bg-white flex items-center justify-center"><svg className="w-5 h-5 text-slate-300 mt-1" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clipRule="evenodd"></path></svg></div></div>
                                    <div className="hidden lg:block text-left"><div className="text-sm font-semibold text-slate-700 leading-tight">{userName}</div><div className="text-[11px] text-slate-500 font-medium">Platform Admin</div></div>
                                </div>
                            </div>
                        </header>

                        {/* CONTENT */}
                        <div className="flex-1 overflow-y-auto p-6 lg:p-10 pb-24 relative z-0">
                            <div className="max-w-7xl mx-auto space-y-8">



                                {/* Header + Add Button */}
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-extrabold text-slate-800 tracking-tight">Manage System Users</h2>
                                        <p className="text-slate-500 text-[15px] mt-1 max-w-2xl leading-relaxed">View, control, and manage all users accessing the PII Sanitization System. Assign roles, monitor activity, and maintain secure access control.</p>
                                    </div>
                                    <button onClick={openAddModal} className="flex items-center gap-2 px-5 py-2.5 bg-gradient-to-r from-deepblue to-cyan-600 hover:from-blue-800 hover:to-cyan-500 text-white font-semibold rounded-xl shadow-lg hover:shadow-[0_4px_20px_rgba(6,182,212,0.4)] transition-all shrink-0">
                                        <Icons.Plus /> Add New User
                                    </button>
                                </div>

                                {/* Stats Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {stats.map((s, i) => {
                                        const Icon = s.icon; return (
                                            <div key={i} className="glass-card bg-white p-6 rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 border border-slate-100 group relative overflow-hidden">
                                                <div className="absolute inset-0 bg-gradient-to-br from-transparent to-slate-50 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                                <div className="flex justify-between items-start relative z-10">
                                                    <div><h3 className="text-3xl font-extrabold text-slate-800 mb-1">{s.value}</h3><p className="text-sm font-semibold text-slate-500">{s.label}</p></div>
                                                    <div className={`p-3 rounded-xl bg-${s.color}-50 text-${s.color}-500 group-hover:scale-110 transition-transform duration-300`}><Icon /></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Filters */}
                                <div className="glass-card bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 items-start lg:items-center">
                                    <div className="relative flex-1 w-full lg:max-w-sm">
                                        <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"><Icons.Search /></div>
                                        <input type="text" value={search} onChange={(e) => { setSearch(e.target.value); setCurrentPage(1); }} className="pl-10 pr-4 py-2.5 w-full bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400 transition-all" placeholder="Search by name or email..." />
                                    </div>
                                    <div className="flex items-center gap-2"><Icons.Filter /><select value={filterRole} onChange={(e) => { setFilterRole(e.target.value); setCurrentPage(1); }} className="py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 cursor-pointer"><option value="All">All Roles</option><option value="Admin">Admin</option><option value="Standard User">Standard User</option></select></div>
                                    <div><select value={filterStatus} onChange={(e) => { setFilterStatus(e.target.value); setCurrentPage(1); }} className="py-2.5 px-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-cyan-500/30 cursor-pointer"><option value="All">All Statuses</option><option value="Active">Active</option><option value="Disabled">Disabled</option></select></div>
                                    <div className="text-xs font-semibold text-slate-400 lg:ml-auto whitespace-nowrap">{filtered.length + " user" + (filtered.length !== 1 ? "s" : "")}</div>
                                </div>

                                {/* User Table */}
                                <div className="glass-card bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead>
                                                <tr className="bg-slate-50/80 border-b border-slate-200 text-[11px] uppercase tracking-wider text-slate-500 font-semibold sticky top-0">
                                                    <th className="p-4 pl-6">User</th>
                                                    <th className="p-4">Email</th>
                                                    <th className="p-4">Role</th>
                                                    <th className="p-4">Status</th>
                                                    <th className="p-4">Last Login</th>
                                                    <th className="p-4">Registered</th>
                                                    <th className="p-4 pr-6 text-right">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-sm">
                                                {
                                                    paginated.length === 0 ? (
                                                        <tr><td colSpan="7" className="p-12 text-center">
                                                            <div className="flex flex-col items-center text-slate-400">
                                                                <svg className="h-12 w-12 mb-3 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                                                <p className="font-semibold text-slate-500">No users found.</p>
                                                                <p className="text-xs mt-1">Try adjusting search or filters.</p>
                                                            </div>
                                                        </td></tr>
                                                    ) : paginated.map((user, idx) => (
                                                        <tr key={user.id} className="hover:bg-slate-50/60 transition-colors group">
                                                            <td className="p-4 pl-6">
                                                                <div className="flex items-center space-x-3">
                                                                    <div className={`w-9 h-9 rounded-full bg-gradient-to-tr ${avatarColors[idx % avatarColors.length]} flex items-center justify-center text-white text-[11px] font-bold shadow-sm shrink-0`}>{user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2)}</div>
                                                                    <span className="font-semibold text-slate-800">{user.name}</span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-slate-500 text-xs font-medium">{user.email}</td>
                                                            <td className="p-4">
                                                                <span className={`text-xs font-bold px-2.5 py-1 rounded-full border ${user.role === 'Admin' ? 'bg-purple-100 text-purple-700 border-purple-200' : 'bg-cyan-50 text-cyan-700 border-cyan-200'}`}>{user.role}</span>
                                                            </td>
                                                            <td className="p-4">
                                                                <span className={`inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full border ${user.status === 'Active' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-600 border-red-200'}`}>
                                                                    <span className={`w-1.5 h-1.5 rounded-full ${user.status === 'Active' ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                                                                    {user.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-4 text-slate-500 text-xs font-medium whitespace-nowrap">{user.lastLogin}</td>
                                                            <td className="p-4 text-slate-500 text-xs font-medium whitespace-nowrap">{user.createdAt}</td>
                                                            <td className="p-4 pr-6 text-right">
                                                                <div className="flex items-center justify-end space-x-1">
                                                                    <button onClick={() => openEditModal(user)} title="Edit Role" className="p-1.5 text-slate-400 hover:text-deepblue hover:bg-blue-50 rounded-lg transition-colors"><Icons.Edit /></button>
                                                                    <button onClick={() => toggleStatus(user)} title={user.status === 'Active' ? 'Disable' : 'Enable'} className={`p-1.5 rounded-lg transition-colors ${user.status === 'Active' ? 'text-slate-400 hover:text-amber-600 hover:bg-amber-50' : 'text-slate-400 hover:text-emerald-600 hover:bg-emerald-50'}`}>
                                                                        {user.status === 'Active' ? <Icons.Ban /> : <Icons.Check />}
                                                                    </button>
                                                                    <button onClick={() => setDeleteConfirm(user.id)} title="Delete User" className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors"><Icons.Trash /></button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    ))}
                                            </tbody>
                                        </table>
                                    </div>

                                    {/* Pagination */}
                                    {totalPages > 1 ? (
                                        <div className="p-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                                            <span>{"Showing " + ((currentPage - 1) * ITEMS_PER_PAGE + 1) + "\u2013" + Math.min(currentPage * ITEMS_PER_PAGE, filtered.length) + " of " + filtered.length}</span>
                                            <div className="flex gap-1">
                                                <button onClick={() => setCurrentPage(p => Math.max(1, p - 1))} disabled={currentPage === 1} className="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium">Prev</button>
                                                {Array.from({ length: totalPages }, (_, i) => i + 1).map(p => (
                                                    <button key={p} onClick={() => setCurrentPage(p)} className={`px-3 py-1.5 rounded-lg font-bold ${p === currentPage ? 'bg-deepblue text-white shadow-sm' : 'border border-slate-200 hover:bg-slate-50'}`}>{p}</button>
                                                ))}
                                                <button onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))} disabled={currentPage === totalPages} className="px-3 py-1.5 border border-slate-200 rounded-lg hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium">Next</button>
                                            </div>
                                        </div>
                                    ) : null}
                                </div>

                            </div>
                        </div>
                    </main>

                    {/* ========== ADD/EDIT USER MODAL ========== */}
                    {showModal ? (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center modal-backdrop" onClick={() => setShowModal(false)}>
                            <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 relative z-10 modal-panel overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between p-6 border-b border-slate-100 bg-slate-50/50">
                                    <h3 className="text-lg font-bold text-slate-800">{modalMode === 'add' ? 'Add New User' : 'Edit User'}</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-700 transition-colors p-1"><Icons.X /></button>
                                </div>
                                <div className="p-6 space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Full Name</label>
                                        <input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400" placeholder="Enter full name" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Email Address</label>
                                        <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400" placeholder="Enter email" />
                                    </div>
                                    {modalMode === 'add' ? (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Password</label>
                                            <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/30 focus:border-cyan-400" placeholder="Set password" />
                                        </div>
                                    ) : null}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase tracking-wider">Role</label>
                                        <div className="flex gap-3">
                                            {['Standard User', 'Admin'].map(r => (
                                                <button key={r} onClick={() => setForm({ ...form, role: r })} className={`flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all ${form.role === r ? (r === 'Admin' ? 'border-purple-400 bg-purple-50 text-purple-700' : 'border-cyan-400 bg-cyan-50 text-cyan-700') : 'border-slate-200 text-slate-500 hover:border-slate-300'}`}>{r}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 border-t border-slate-100 flex justify-end space-x-3 bg-slate-50/50">
                                    <button onClick={() => setShowModal(false)} className="px-5 py-2.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
                                    <button onClick={handleSave} disabled={saving} className="px-6 py-2.5 bg-gradient-to-r from-deepblue to-cyan-600 hover:from-blue-800 hover:to-cyan-500 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all disabled:opacity-60">{saving ? 'Saving...' : (modalMode === 'add' ? 'Create User' : 'Save Changes')}</button>
                                </div>
                            </div>
                        </div>
                    ) : null}

                    {/* ========== DELETE CONFIRM MODAL ========== */}
                    {deleteConfirm ? (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center modal-backdrop" onClick={() => setDeleteConfirm(null)}>
                            <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 relative z-10 modal-panel overflow-hidden" onClick={e => e.stopPropagation()}>
                                <div className="p-8 text-center">
                                    <div className="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-5">
                                        <svg className="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-800 mb-2">Delete User?</h3>
                                    <p className="text-sm text-slate-500 mb-6">This action cannot be undone. The user and all associated data will be permanently removed.</p>
                                    <div className="flex justify-center space-x-3">
                                        <button onClick={() => setDeleteConfirm(null)} className="px-5 py-2.5 border border-slate-200 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors">Cancel</button>
                                        <button onClick={() => deleteUser(deleteConfirm)} className="px-6 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-xl shadow-md transition-all">Delete</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : null}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<UserManagementPage />);
    </script>
</body>

</html>
